<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对话 · Open Web Agents</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/owa.css">
<style>
/* ===== 对话页（ch- 前缀） ===== */
.slist{background:var(--bg)}
.ch-lhead{padding:14px 12px 6px;display:flex;gap:8px;align-items:center}
.ch-lsearch{position:relative;flex:1;min-width:0}
.ch-lsearch svg{position:absolute;left:10px;top:10px;color:var(--sub)}
.ch-lsearch .inp{padding-left:32px;height:36px}
.ch-lbody{flex:1;overflow:auto;padding:0 10px 10px}
.ch-row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 8px 8px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;min-height:46px}
.ch-row:hover{background:#EFEDE7}
.ch-row.on{background:#fff;border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ch-row .tt{flex:1;min-width:0}
.ch-row .t1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.ch-row .t2{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;line-height:1.4;white-space:nowrap;overflow:hidden}
.ch-row .t2 .tag{height:18px;font-size:12px;padding:0 6px}
.ch-row .more{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--sub);opacity:0;flex:none}
.ch-row:hover .more,.ch-row.on .more,.ch-row .more:focus-visible{opacity:1}
.ch-row .more:hover{background:#E6E3DB;color:var(--ink)}
.ch-row .spin{width:14px;height:14px}
.ch-lfoot{padding:10px 12px 54px;border-top:1px solid var(--line)}
.ch-lfoot .ibtn{width:100%;justify-content:flex-start;height:36px}
.ch-lempty{padding:28px 14px;text-align:center;color:var(--sub);font-size:13px}

.cmain{padding:16px 0 16px 16px}
.ch-hd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);min-height:66px}
.ch-hd .avl{display:flex;border-radius:50%}
.ch-hd .ti{font-weight:600;font-size:15.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-hd .sub{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:4px 8px;margin-top:2px;min-width:0;flex-wrap:wrap}
.ch-hd .sub>*{white-space:nowrap}
.ch-hd .sub a{color:var(--ink);font-weight:500;text-decoration:none}
.ch-hd .sub a:hover{text-decoration:underline;text-underline-offset:3px}
.ch-hd .sub .tag{height:20px}
.ch-tog{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#3C3A35;white-space:nowrap}
.ch-tog:hover{background:#F4F2EC}
.ch-tog.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.ch-bar{display:flex;align-items:center;gap:8px;margin:10px 20px 0;padding:8px 12px;border-radius:10px;font-size:14px;background:#F4F2EC;color:#3C3A35}
.ch-bar.warn{background:var(--warnbg);color:var(--warnt)}
.ch-bar.info{background:#EEF1F4;color:#34465A}
.ch-bar .link{margin-left:auto;white-space:nowrap}

.ch-sw{flex:1;min-height:0;position:relative;display:flex}
.ch-stream{flex:1;overflow:auto;padding:22px 64px 28px 36px;scroll-behavior:smooth}
.ch-inner{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ch-turn{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.ch-turn+.ch-turn{padding-top:18px;border-top:1px dashed var(--line)}
.ch-me{max-width:78%;font-size:14.5px}
.ch-att{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ch-att .tag{background:rgba(255,255,255,.7)}
.ch-fork{align-self:flex-end;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:-4px}
.ch-tx{font-size:14.5px;line-height:1.75}
.ch-tx ul{margin:6px 0;padding-left:20px}
.ch-tx li{margin:2px 0}
.ch-cont{margin-left:40px;display:flex;flex-direction:column;gap:10px}
.m-bot .bd{display:flex;flex-direction:column;gap:8px}
.m-bot .who{margin-bottom:0}
.ch-think{border-left:2px solid #DAD6CC;padding:0 0 0 12px}
.ch-think>button{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);height:26px}
.ch-think>button:hover{color:var(--ink)}
.ch-think .chev{transition:transform .2s}
.ch-think.open .chev{transform:rotate(90deg)}
.ch-think .tb2{display:none;font-size:14px;color:#55524B;line-height:1.7;padding:2px 0 4px}
.ch-think.open .tb2{display:block}
.ch-tools{border:1px solid var(--line);border-radius:12px;background:#FBFAF7}
.ch-tools .hd{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;font-size:14px;color:#3C3A35;text-align:left;min-height:38px}
.ch-tools .hd .bad{color:var(--bad)}
.ch-tools .hd .chev{color:var(--sub);transition:transform .2s}
.ch-tools.open .hd .chev{transform:rotate(90deg)}
.ch-tools .ls{display:none;border-top:1px solid var(--line2);padding:4px}
.ch-tools.open .ls{display:block}
.ch-ti{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px;text-align:left;font-size:14px;min-height:34px}
.ch-ti:hover{background:#F1EFE9}
.ch-ti .nm{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap}
.ch-ti .ds{color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-ti .du{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.ch-ti .tag{height:20px}
.st-ok{color:var(--ok)}
.st-fail{color:var(--bad)}
.st-wait{color:var(--warnt)}
.ch-steer{align-self:flex-end;max-width:72%;border:1px dashed #C9C4B8;background:#FAF9F5;border-radius:14px 14px 4px 14px;padding:8px 14px;font-size:14px}
.ch-steer .lb{font-size:12px;display:flex;align-items:center;gap:5px;margin-bottom:2px}
.ch-steer .lb.ok{color:var(--ok)}
.ch-steer .lb.warn{color:var(--warnt)}
.ch-steer .lb.wait{color:var(--sub)}
.ch-res{border-radius:14px;padding:12px 14px;border:1px solid}
.ch-res .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.ch-res.json{border-color:#D3E2D6;background:#F3F7F3}
.ch-res.json .t{color:var(--ok)}
.ch-res.fail{border-color:#EBC5BB;background:#FCF3F0}
.ch-res.fail .t{color:var(--bad)}
.ch-res.cancel{border-color:var(--line);background:#F6F5F1}
.ch-res.cancel .t{color:#4D4A43}
.ch-res .code{font-size:14px;margin-top:8px;white-space:pre-wrap}
.ch-res p{margin:4px 0 0;font-size:14px;color:#4A4740}
.ch-meta{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.ch-meta .tok{margin-right:6px;font-variant-numeric:tabular-nums}
.ch-live{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.ch-rail{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px}
.ch-rail button{width:28px;height:26px;border-radius:8px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.ch-rail button:hover{background:#F1EFE9;color:var(--ink)}
.ch-rail button.on{background:var(--btn);color:#fff}
.ch-latest{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);height:34px;padding:0 14px;border-radius:17px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(40,35,25,.12);display:flex;align-items:center;gap:6px;font-size:13px}
.ch-latest:hover{background:#F4F2EC}
.ch-latest[hidden],.cside[hidden],.ch-rs[hidden]{display:none}
.ch-flash{animation:chflash 1.6s ease-out}
@keyframes chflash{0%{background:#FCE9B8}100%{background:transparent}}

/* 提问卡片 */
.askc{margin-top:0}
.askc .hd2{display:flex;align-items:center;gap:6px;font-size:13px}
.askc .hd2.pending{color:var(--warnt)}
.askc .hd2.ok{color:var(--ok)}
.askc .hd2.mut{color:var(--sub)}
.askc .q{display:flex;align-items:center;gap:8px}
.askc .q .tag{font-weight:400}
.askc .opt[disabled]{cursor:default;color:#4D4A43}
.askc .opt.on[disabled]{color:var(--ink)}
.askc .oth{margin-top:8px;height:34px;font-size:14px}
.askc.pend{border-color:#E7C78C;box-shadow:0 0 0 3px #FBF3E2}
.askc .ft{flex-wrap:wrap}
.askc.mute{background:#F8F7F3}

/* 底部：审批、授权、排队、输入框 */
.ch-dock{flex:none;padding-top:4px}
.approval .snap{white-space:pre-wrap;word-break:break-all}
.approval .row{flex-wrap:wrap}
.approval .cd{margin-left:auto;font-variant-numeric:tabular-nums}
.approval .why{display:flex;gap:8px;margin-top:8px}
.approval.err{background:#FCF3F0;border-color:#EBC5BB}
.ch-grants{display:flex;align-items:center;gap:8px;margin:0 20px 8px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.ch-grants .g{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;border-radius:13px;background:var(--okbg);color:#2C5C40;font-family:var(--mono);font-size:12px}
.ch-grants .g button{height:22px;padding:0 8px;border-radius:11px;font-family:var(--sans);font-size:12px;color:#2C5C40}
.ch-grants .g button:hover{background:#D6E5DA}
.ch-queue{margin:0 20px 8px;border:1px solid var(--line);border-radius:12px;background:#FBFAF7;padding:6px 8px}
.ch-queue .qh{font-size:12.5px;color:var(--sub);padding:2px 6px 4px;display:flex;align-items:center;gap:6px}
.ch-queue .qi{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:14px}
.ch-queue .qi:hover{background:#F1EFE9}
.ch-queue .qi .x{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;color:var(--sub)}
.ch-queue .qi .x:hover{background:#E6E3DB;color:var(--ink)}
.composer{margin:0 20px 16px;position:relative}
.composer textarea{height:44px;font-size:14.5px}
.composer .bar{gap:8px}
.composer .bar>.ibtn,.composer .bar>.ch-ctx{white-space:nowrap;flex:none}
.ch-ctx{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);height:30px;padding:0 6px;border-radius:15px}
.ch-ctx:hover{background:#F1EFE9}
.sendbtn[disabled],.ibtn[disabled]{opacity:.4;cursor:not-allowed}
.ch-stop{width:34px;height:34px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center}
.ch-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ch-chips .tag{padding-right:3px}
.ch-chips .tag button{width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.ch-chips .tag button:hover{background:#DDD9CF}
.slash{width:300px;z-index:5}
.slash div{display:flex;gap:10px;align-items:center;cursor:pointer}
.slash div.sel{background:#EFEDE7}
.slash div b{font-family:var(--mono);font-weight:600;width:64px}
.slash .sh{font-size:12px;color:var(--sub);padding:4px 10px 2px;cursor:default}
.slash .sh:hover{background:none}
.ch-attmenu{position:absolute;bottom:46px;left:8px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:6px;width:250px}
.ch-attmenu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;text-align:left}
.ch-attmenu button:hover{background:#F4F2EC}
.ch-attmenu .h{font-size:12px;color:var(--sub);padding:6px 10px 2px}

/* 空状态 */
.ch-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 40px;text-align:center}
.ch-empty h2{font-family:var(--serif);font-size:28px;margin:18px 0 6px;line-height:1.3}
.ch-empty p{color:var(--sub);margin:0;max-width:460px}
.ch-starters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px;width:min(560px,100%)}
.ch-starters button{border:1px solid var(--line);background:#FBFAF7;border-radius:14px;padding:12px 14px;text-align:left;font-size:14px;display:flex;align-items:center;gap:8px}
.ch-starters button:hover{border-color:#BDB8AC;background:#fff}
.ch-empty a.btn{color:#fff}
.ch-empty a.btn.ghost{color:var(--ink)}
.ch-loading{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--sub)}

/* 右侧面板 */
.cside{padding:16px 16px 16px 0;width:400px}
.ch-rs{width:16px;flex:none;cursor:col-resize;position:relative}
.ch-rs::after{content:"";position:absolute;left:7px;top:40%;height:20%;width:3px;border-radius:2px;background:#D9D5CB;transition:background .2s}
.ch-rs:hover::after,.ch-rs.drag::after{background:#8E897D}
.ch-ph{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line2)}
.ch-ph .xbtn{width:32px;height:32px;margin-left:auto}
.ch-path{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--sub)}
.ch-path{white-space:nowrap}
.ch-path code{overflow:hidden;text-overflow:ellipsis;min-width:0;font-family:var(--mono);color:#3C3A35;background:#F4F2EC;padding:2px 6px;border-radius:6px}
.ch-ftree{padding:6px 8px;max-height:260px;overflow:auto;border-bottom:1px solid var(--line2);flex:none}
.ch-ftree .f{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:14px;width:100%;text-align:left;min-height:32px}
.ch-ftree .f:hover{background:#F4F2EC}
.ch-ftree .f.on{background:#EFEDE7;font-weight:500}
.ch-ftree .f .sz{margin-left:auto;font-size:12px;color:var(--sub)}
.ch-ftree .f.new .nm::after{content:"新";margin-left:6px;font-size:12px;padding:1px 5px;border-radius:8px;background:#FBE7BD;color:#7A4F0C}
.ch-prev{flex:1;min-height:0;display:flex;flex-direction:column}
.ch-prevh{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--line2)}
.ch-prevh b{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-prevh .ibtn{padding:0 8px}
.ch-prevb{flex:1;overflow:auto;padding:12px 14px}
.ch-prevb iframe{width:100%;height:100%;min-height:360px;border:0;background:#fff}
.ch-prevb .code{font-size:14px;white-space:pre;padding:12px}
.ch-trunc{margin-top:8px;font-size:12.5px;color:var(--warnt);background:var(--warnbg);border-radius:8px;padding:8px 10px;display:flex;gap:6px;align-items:center}
.ch-pdf{background:#EDEBE5;border-radius:10px;padding:14px}
.ch-pdf .pg{background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:18px 18px 22px;font-size:14px;line-height:1.7}
.ch-pdf .pg h5{margin:0 0 8px;font-size:14px;text-align:center;letter-spacing:.1em;color:#8F3423}
.ch-img{display:flex;justify-content:center;background:#EDEBE5;border-radius:10px;padding:16px}
.ch-rcpt{width:200px;background:#fff;padding:14px 14px 18px;font-size:12px;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.1);transform:rotate(-1.5deg);font-family:var(--mono)}
.ch-pempty{padding:40px 22px;text-align:center;color:var(--sub);font-size:14px}
.ch-pempty .serif{font-size:17px;color:var(--ink);margin:10px 0 4px}
.ch-tr{flex:1;overflow:auto;padding:10px 12px 16px}
.ch-trh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:10px 4px 6px}
.ch-trh .muted{font-weight:400}
.ch-tri{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden;transition:box-shadow .3s}
.ch-tri>button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;text-align:left;font-size:13px;min-height:38px}
.ch-tri>button:hover{background:#FAF9F6}
.ch-tri .nm{font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ch-tri .du{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
.ch-tri .det{display:none;padding:2px 12px 12px;font-size:13px;border-top:1px solid var(--line2)}
.ch-tri.open .det{display:block}
.ch-tri.sel{border-color:#9C978B;box-shadow:0 0 0 3px #ECE9E1}
.ch-tri .det .lb{font-size:12px;color:var(--sub);margin:10px 0 4px}
.ch-tri .det .snap{margin:0;font-size:13px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.ch-ti.sel{background:#EFEDE7;box-shadow:inset 3px 0 0 var(--ink)}
.ch-tri.fail{border-color:#EBC5BB}

/* 弹层内 */
.ch-agl{display:flex;flex-direction:column;gap:4px;max-height:430px;overflow:auto;margin:12px -6px 0;padding:0 6px}
.ch-agi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-align:left;width:100%;border:1px solid transparent}
.ch-agi:hover{background:#F6F5F1;border-color:var(--line)}
.ch-agi .n{font-weight:600}
.ch-agi .d{font-size:12.5px;color:var(--sub)}
.ch-agh{font-size:12px;color:var(--sub);padding:10px 12px 2px}

/* 拖放覆盖层与提示卡 */
.ch-drop{position:fixed;inset:0;z-index:85;background:rgba(247,246,242,.86);display:none;align-items:center;justify-content:center}
.ch-drop.on{display:flex}
.ch-drop .bx{border:2px dashed #9C978B;border-radius:24px;padding:48px 80px;text-align:center;background:#fff}
.ch-drop .bx .serif{font-size:26px;margin:12px 0 4px}
.ch-note{position:fixed;top:72px;right:24px;z-index:60;width:360px;background:#fff;border:1px solid #E7C78C;border-radius:16px;box-shadow:0 14px 40px rgba(40,35,25,.16);padding:14px 16px;animation:rise .25s}
.ch-note .row{align-items:flex-start}
#ch-proto{position:fixed;left:122px;bottom:14px;z-index:100;height:30px;padding:0 4px 0 12px;border-radius:15px;background:#2A2926;color:#E9E6DE;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.82}
#ch-proto:hover{opacity:1}
#ch-proto select{background:#3A3935;color:#fff;border:0;border-radius:11px;height:22px;font-size:12px;padding:0 6px;outline:none}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/owa.js"></script>
<script>
"use strict";
/* 对话（原 / 工作台）：会话列表、对话流、提问、审批、变量、输入框、工作区文件、执行详情 */

/* ---------- 智能体信息（与 owa.js 的 MARKET / MY_AGENTS 一致） ---------- */
const SONNET = { model: "claude-sonnet-4-5", price: "输入 300 / 输出 1500 积分每百万 token" };
const HAIKU = { model: "claude-haiku-4-5", price: "输入 80 / 输出 400 积分每百万 token" };
const AGI = {
  "expense-reviewer": { n: "报销审核助手", href: "build.html", ...SONNET, d: "读取发票和报销单，按公司制度做初审，超额提醒审批", starters: ["这批 11 月差旅报销能过吗？", "这张发票抬头对吗", "外币发票怎么换算", "餐饮超标准怎么处理"], vars: true },
  meeting: { n: "会议纪要整理", href: "build.html", ...HAIKU, d: MARKET[0].d, starters: MARKET[0].starters },
  sql: { n: "SQL 助手", href: "market-detail.html", ...HAIKU, d: MARKET[3].d, starters: MARKET[3].starters },
  contract: { n: "合同条款比对", href: "market-detail.html", ...SONNET, d: MARKET[5].d, starters: MARKET[5].starters },
  weekly: { n: "周报生成器", href: "build.html", ...HAIKU, d: MARKET[7].d, starters: MARKET[7].starters },

  lines.forEach((l) => {

      if (/^\|\s*---/.test(l)) return;
      const cells = l.split("|").slice(1, -1).map((c) => c.trim());
      if (!inT) { h += "<table><tr>" + cells.map((c) => `<th>${inl(c)}</th>`).join("") + "</tr>"; inT = true; }
      else h += "<tr>" + cells.map((c) => `<td>${inl(c)}</td>`).join("") + "</tr>";
      return;
    }
    if (inT) { h += "</table>"; inT = false; }
    if (l.startsWith("- ")) { if (!inL) { h += "<ul>"; inL = true; } h += `<li>${inl(l.slice(2))}</li>`; return; }
    if (inL) { h += "</ul>"; inL = false; }
    if (l.startsWith("# ")) h += `<h1>${inl(l.slice(2))}</h1>`;
    else if (l.startsWith("## ")) h += `<h2>${inl(l.slice(3))}</h2>`;
    else if (l.trim()) h += `<p>${inl(l)}</p>`;
  });
  if (inT) h += "</table>"; if (inL) h += "</ul>";

});
OWA.on("c-ans", (el) => {
  const [sid, i] = el.dataset.t.split(":"); const t = S.turns[sid][+i];
  t.ask.st = "waiting"; rMain();
  setTimeout(() => { t.ask.st = "answered"; t.ask.at = "刚刚"; toast("回答已交给智能体"); rMain(); setTimeout(() => finishAsk(sid, +i), 1300); }, 900);
});
OWA.on("c-noans", (el) => { const [sid, i] = el.dataset.t.split(":"); const t = S.turns[sid][+i]; t.ask.st = "skipped"; rMain(); setTimeout(() => finishAsk(sid, +i), 900); });
OWA.on("c-asnew", (el) => { const [sid, i] = el.dataset.t.split(":"); const q = S.turns[sid][+i].ask.qs[0]; S.draft = `关于「${q.q}」：按${q.opts[0]}。`; rMain(); $("#ch-in").focus(); toast("已放进输入框，确认后发送"); });
OWA.on("c-ap", (el) => decide(el.dataset.v));
OWA.on("c-ap-why", () => { S.approval.reason = !S.approval.reason; rMain(); setTimeout(() => $("#ch-ap-r")?.focus(), 20); });
OWA.on("c-ap-retry", () => { const b = $('[data-a="c-ap-retry"]'); b.innerHTML = '<span class="spin" style="width:14px;height:14px"></span>读取中'; setTimeout(() => { S.approvalErr = false; toast("审批状态已更新，没有待确认的操作"); rMain(); }, 700); });
OWA.on("c-note-x", () => $("#ch-note")?.remove());
OWA.on("c-revoke", (el) => { const g = S.grants[+el.dataset.i]; confirmBox({ title: "撤销这项授权？", body: `<p class="muted" style="margin:0">之后智能体再调用 <code>${g.tool}</code> 时，会重新请你确认。</p>`, ok: "撤销", onOk: () => { S.grants.splice(+el.dataset.i, 1); toast(`已撤销 ${g.tool} 的授权`); rMain(); } }); });
OWA.on("c-unqueue", (el) => { const q = S.queue.splice(+el.dataset.i, 1)[0]; toast(`已取消排队：${q.text.slice(0, 14)}…`); rMain(); });
OWA.on("c-vars", () => openVars());
OWA.on("c-vars-save", () => {
  const t = $("#v1").value.trim();
  if (!t && !S.vars.filled) { $("#v-err").textContent = "ERP_TOKEN 是必填的"; return; }
  S.vars = { filled: true, ERP_TOKEN: t || S.vars.ERP_TOKEN, DEPT: $("#v2").value.trim() };
  closeModal(); toast($("#v3")?.checked ? "已保存，只用于这个会话" : "变量已保存"); rMain();
});
OWA.on("c-send", () => send());
OWA.on("c-stop", () => stopRun());
OWA.on("c-slash", (el) => runSlash(el.dataset.c));
OWA.on("c-attmenu", () => { S.attMenu = !S.attMenu; rMain(); });
OWA.on("c-att", (el) => {
  S.attMenu = false;
  if (el.dataset.v === "big") { toast("差旅录像.mov 有 86MB，超过单个文件 10MB 的上限", false); return rMain(); }
  S.atts.push({ n: "酒店水单-1021.jpg", sz: "820 KB", img: true }); toast("已添加，发送时会上传到工作目录"); rMain();
});
OWA.on("c-unatt", (el) => { S.atts.splice(+el.dataset.i, 1); rMain(); });
OWA.on("c-ctx", () => { const [p, t] = S.ctx[S.sid] || [0, "0"]; toast(`上下文已用 ${p}%（上限按 200k 计），这个会话累计处理 ${t} token`); });
OWA.on("c-retry", () => { closeModal(); const b = $('[data-a="c-retry"]'); if (b) b.innerHTML = '<span class="spin" style="width:14px;height:14px"></span>读取中'; setTimeout(() => applyDemo("normal"), 700); });
OWA.on("c-demo", (el) => applyDemo(el.dataset.v));

/* 拖放附件 */
let dragN = 0;
addEventListener("dragenter", (e) => { if (!e.dataTransfer?.types?.includes("Files")) return; dragN++; $("#ch-drop")?.classList.add("on"); });
addEventListener("dragleave", () => { dragN = Math.max(0, dragN - 1); if (!dragN) $("#ch-drop")?.classList.remove("on"); });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => {
  e.preventDefault(); dragN = 0; $("#ch-drop")?.classList.remove("on");
  const fs = Array.from(e.dataTransfer?.files || []);
  fs.forEach((f) => { if (f.size > 10 * 1024 * 1024) toast(`${f.name} 超过 10MB，没有添加`, false); else S.atts.push({ n: f.name, sz: f.size > 1048576 ? (f.size / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(f.size / 1024)) + " KB", img: /^image\//.test(f.type) }); });
  rMain();
});
document.addEventListener("click", (e) => { if (S.attMenu && !e.target.closest(".ch-attmenu,[data-a=c-attmenu]")) { S.attMenu = false; $(".ch-attmenu")?.remove(); } });

/* ---------- 启动 ---------- */
setInterval(tick, 1000);
(function boot() {
  const p = new URLSearchParams(location.search);
  applyDemo(p.get("demo") || (p.get("agent") && !AGI[p.get("agent")] ? "badagent" : "normal"));
  if (p.get("session") && S.sessions.find((s) => s.id === p.get("session"))) openSession(p.get("session"));
  if (location.hash === "#new") newSession();
})();
</script>
</body>
</html>
