<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录 · Open Web Agents</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/owa.css">
<style>
.lg-page{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;overflow:auto}
.lg-card{width:980px;min-height:580px;display:grid;grid-template-columns:minmax(0,1fr) 440px;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(60,50,30,.07)}
.lg-left{background:var(--band);padding:40px 44px;display:flex;flex-direction:column}
.lg-left .avrow .av{box-shadow:0 0 0 3px var(--band)}
.lg-left h1{font-family:var(--serif);font-size:38px;line-height:1.3;margin:28px 0 14px;font-weight:700}
.lg-left p{margin:0;font-size:15px;color:var(--sub);line-height:1.7}
.lg-left .foot{margin-top:auto;font-size:13px;color:var(--sub)}
.lg-right{padding:44px 44px 36px;display:flex;flex-direction:column}
.lg-right h2{font-family:var(--serif);font-size:28px;margin:0 0 6px;line-height:1.25}
.lg-right .lead{margin:0 0 24px;color:var(--sub);font-size:14px}
.lg-right .inp{height:44px;font-size:15px}
.lg-err{display:flex;align-items:center;gap:8px;background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.lg-fe{color:var(--bad);font-size:12px;min-height:0}
.lg-submit{width:100%;height:46px;border-radius:23px;font-size:15px;margin-top:6px}
.lg-switch{margin-top:18px;text-align:center;font-size:14px;color:var(--sub)}
.lg-switch button{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9C4B8}
.lg-admin{display:flex;gap:10px;background:#F2F1EC;border-radius:12px;padding:12px 14px;font-size:14px;color:#3C3A35;margin-bottom:18px}
.lg-proto{position:fixed;left:122px;bottom:14px;z-index:100;min-height:30px;display:flex;align-items:center;gap:10px;padding:3px 3px 3px 12px;border-radius:16px;background:#2A2926;color:#E9E6DE;font-size:12px}
.lg-proto:hover{opacity:1}
.lg-proto .seg{padding:2px}
.lg-proto .seg button{height:24px;padding:0 10px;font-size:12px;color:#3C3A35}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/owa.js"></script>
<script>
"use strict";
/* 登录 / 注册 / 首次部署创建管理员（原 /login），不带顶栏 */
const S = { mode: "login", signup: true, fail: "none", busy: false, err: "" };
const MODES = {
  login: { t: "登录以继续", lead: "用你的邮箱和密码登录。", btn: "登录" },
  signup: { t: "创建账号", lead: "注册后是普通账号，可以使用市场里的智能体，也能搭建自己的。", btn: "创建账号" },
  first: { t: "创建管理员账号", lead: "欢迎使用 Open Web Agents。先创建第一个账号。", btn: "创建管理员账号" },
};

OWA.mount({
  nav: false,
  body: `<div class="lg-page"><div class="lg-card">
    <section class="lg-left">
      <a class="brand navlink" href="explore.html" style="display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px">${brand().replace(/^<a[^>]*>|<\/a>$/g, "")}</a>
      <div style="margin-top:56px" class="avrow">${["expense-reviewer", "meeting", "rival", "review", "builder", "xhs", "sql"].map((k) => av(k, 54)).join("")}</div>
      <h1>把要做的事，<br>交给会做事的 AI 同事。</h1>
      <p>在市场里找一个直接用，或者说清规则搭一个自己的：评测通过再发布，用 API 接进你的系统。</p>
      <div class="foot">自部署版本，数据保存在你们自己的服务器上。</div>
    </section>
    <section class="lg-right" id="lg-form"></section>
  </div></div>
  <div class="lg-proto" title="原型演示用，不属于产品界面">原型开关
    <div class="seg" id="lg-pm">${[["login", "登录"], ["signup", "注册"], ["first", "首次部署"]].map(([v, n]) => `<button data-a="lg-pm" data-v="${v}">${n}</button>`).join("")}</div>
    <div class="seg" id="lg-ps"><button data-a="lg-ps" data-v="1">允许注册</button><button data-a="lg-ps" data-v="0">关闭注册</button></div>
    <span>下次提交</span><div class="seg" id="lg-pf">${[["none", "成功"], ["bad", "密码错误"], ["rate", "限流"]].map(([v, n]) => `<button data-a="lg-pf" data-v="${v}">${n}</button>`).join("")}</div>
  </div>`,
});

function render() {
  const m = MODES[S.mode], reg = S.mode !== "login";
  const keep = { e: $("#lg-email")?.value ?? "linzhou@xinghe.example", p: $("#lg-pw")?.value ?? "" };
  $("#lg-form").innerHTML = `<h2>${m.t}</h2><p class="lead">${m.lead}</p>
    ${S.mode === "first" ? `<div class="lg-admin">${ic("shield", 18)}<div>这是这台部署的第一个账号，会自动成为<b>平台管理员</b>，可以管理账号、模型与提供者、市场上架和计费。</div></div>` : ""}
    ${S.err ? `<div class="lg-err" role="alert">${ic("warn", 16)}${S.err}</div>` : ""}
    <form id="lg-f" novalidate>
      <div class="fld"><label for="lg-email">邮箱</label><input class="inp" id="lg-email" type="email" autocomplete="email" placeholder="name@company.com" value="${esc(S.mode === "first" ? "" : keep.e)}"><span class="lg-fe" id="fe-email"></span></div>
      <div class="fld"><label for="lg-pw">密码</label><input class="inp" id="lg-pw" type="password" autocomplete="${reg ? "new-password" : "current-password"}" placeholder="${reg ? "至少 8 位" : ""}" value="${esc(keep.p)}"><span class="lg-fe" id="fe-pw"></span></div>
      ${reg ? `<div class="fld"><label for="lg-pw2">再次输入密码</label><input class="inp" id="lg-pw2" type="password" autocomplete="new-password"><span class="lg-fe" id="fe-pw2"></span></div>` : ""}
      <button class="btn lg-submit" id="lg-go" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? '<span class="spin" style="border-color:#8A867C;border-top-color:#fff"></span>处理中…' : m.btn}</button>
    </form>
    ${S.mode === "first" ? "" : S.signup ? `<div class="lg-switch">${S.mode === "login" ? `还没有账号？<button data-a="lg-to" data-v="signup">去注册</button>` : `已有账号？<button data-a="lg-to" data-v="login">去登录</button>`}</div>`
      : `<div class="lg-switch">需要账号请联系平台管理员</div>`}`;
  $("#lg-f").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  $$("#lg-pm button").forEach((b) => b.classList.toggle("on", b.dataset.v === S.mode));
  $$("#lg-ps button").forEach((b) => b.classList.toggle("on", b.dataset.v === (S.signup ? "1" : "0")));
  $$("#lg-pf button").forEach((b) => b.classList.toggle("on", b.dataset.v === S.fail));
}
async function submit() {
  if (S.busy) return;
  const reg = S.mode !== "login";
  const e = $("#lg-email").value.trim(), p = $("#lg-pw").value, p2 = reg ? $("#lg-pw2").value : "";
  ["email", "pw", "pw2"].forEach((k) => { const el = $("#fe-" + k); if (el) el.textContent = ""; });
  let bad = false;
  const fe = (k, t) => { $("#fe-" + k).textContent = t; bad = true; };
  if (!e) fe("email", "请输入邮箱"); else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) fe("email", "邮箱格式不对");
  if (!p) fe("pw", "请输入密码"); else if (reg && p.length < 8) fe("pw", "密码至少 8 位");
  if (reg && !bad && p !== p2) fe("pw2", "两次输入的密码不一致");
  if (bad) return;
  const vals = { e, p, p2 };
  S.busy = true; S.err = ""; render(); restore(vals);
  await later(1000);
  S.busy = false;
  if (S.fail === "bad" && S.mode === "login") { S.err = "账号或密码错误"; render(); restore({ e, p: "" }); $("#lg-pw").focus(); return; }
  if (S.fail === "rate") { S.err = "请求过于频繁，请稍后再试"; render(); restore(vals); return; }
  localStorage.setItem("owa.proto.role", S.mode === "first" ? "admin" : "user");
  toast(S.mode === "login" ? "登录成功" : S.mode === "first" ? "管理员账号已创建" : "账号已创建");
  render(); restore(vals);
  await later(600);
  location.href = "explore.html";
}
function restore({ e, p, p2 }) {
  if (e != null) $("#lg-email").value = e;
  if (p != null) $("#lg-pw").value = p;
  if (p2 != null && $("#lg-pw2")) $("#lg-pw2").value = p2;
}

OWA.on("lg-to", (t) => { S.mode = t.dataset.v; S.err = ""; render(); });
OWA.on("lg-pm", (t) => { S.mode = t.dataset.v; S.err = ""; if (S.mode === "signup") S.signup = true; render(); });
OWA.on("lg-ps", (t) => { S.signup = t.dataset.v === "1"; if (!S.signup && S.mode === "signup") S.mode = "login"; render(); });
OWA.on("lg-pf", (t) => { S.fail = t.dataset.v; render(); });
render();
</script>
</body>
</html>
