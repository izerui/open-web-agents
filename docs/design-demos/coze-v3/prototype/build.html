<style>

.b-dbtn{height:32px;padding:0 10px;border-radius:16px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#F2EFE7;border:1px solid #4A4842;white-space:nowrap}
.b-dbtn:hover{background:#34322D}
.b-dbtn.hot{background:#F2EFE7;color:#1F1E1C;border-color:#F2EFE7}
.b-dbtn b{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:#B7791F;color:#fff;font-size:12px}

.b-dempty{text-align:center;padding:36px 12px 10px;display:flex;flex-direction:column;align-items:center}

.b-chtools{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#F6F5F1}

.b-feed{margin:0 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(40,35,25,.08)}
.b-feed .fi{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line2);font-size:13px}

.b-state{margin:10px 12px 0;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}

.b-state.bad{background:var(--badbg);color:var(--bad)}

/* 档案卡 */
.b-err{color:var(--bad);font-size:12px;min-height:0}
.b-hint{color:var(--sub);font-size:14px}
.b-item{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.b-item .ih{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:48px}

.b-mono{font-family:var(--mono);font-size:14px}
.b-taM{font-family:var(--mono);font-size:14px}

.b-proto{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;border:1px dashed #A9A396;color:#5C584F;font-size:12px;background:#FBFAF7}

.b-drop{border:1.5px dashed #C9C4B8;border-radius:14px;padding:16px;text-align:center;background:#FBFAF7;transition:all .15s}
.b-drop.on{border-color:var(--ink);background:#F2F0EA}
.b-up{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.b-meter{height:6px;border-radius:3px;background:#ECEAE3;overflow:hidden;width:120px;display:inline-block;vertical-align:middle}
.b-meter i{display:block;height:100%;background:#8B8576}
.b-doc{cursor:pointer}
.b-doc:hover{background:#FAF9F6}
.b-chips{display:flex;gap:6px;flex-wrap:wrap}
.b-varchip{font-family:var(--mono);font-size:12px;height:24px;padding:0 8px;border-radius:12px;background:#F1EFEA;color:#4D4A43;display:inline-flex;align-items:center}
.b-varchip:hover{background:#E6E3DB}
.b-vrow{display:grid;grid-template-columns:170px minmax(0,1fr) 64px 64px 32px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2)}
.b-vrow:last-child{border-bottom:0}
.b-vrow.hd{font-size:12px;color:var(--sub);padding-top:6px;padding-bottom:6px}
.b-ck{display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.b-ck input{width:16px;height:16px;accent-color:#1C1C1C}
.b-swatch{width:32px;height:32px;border-radius:50%}
.fld>.seg{align-self:flex-start}
.b-rad3{display:flex;flex-direction:column;gap:2px}
/* 试聊 */
.b-sc .grid2 .fld{margin-bottom:10px}
/* 评测 */
.b-cf .fld{margin-bottom:10px}
.case .detail .b-why{color:var(--bad)}
.case .ch2 .ibtn{flex:none}
.b-tgt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b-tgt .prog{width:96px}
.b-hist tr td{white-space:nowrap}
/* 发布 */
.b-okcard{border:1px solid #CFE0D3;background:#F3F8F4;border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:18px}
.b-okcard .big{width:46px;height:46px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .5s ease-out}
.b-cnt{font-size:12px;color:var(--sub);text-align:right;margin-top:4px}
.b-danger{border:1px solid #EBC5BB;border-radius:16px;padding:16px 18px;margin-top:22px;background:#FFFCFB}
.b-dk{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:12px;font-weight:600}
.b-dk.add{background:var(--okbg);color:var(--ok)}
.b-dk.del{background:var(--badbg);color:var(--bad)}
.b-dk.mod{background:var(--warnbg);color:var(--warnt)}
.ver .acts{display:flex;flex-wrap:wrap;width:100%;padding-left:48px;gap:2px;margin-top:-4px}
.ver .acts .ibtn[disabled]{color:#6B6860;opacity:.85;cursor:not-allowed;background:none}
/* 接入 */
.b-ep{display:grid;grid-template-columns:64px 300px 1fr;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13px}
.b-ep:last-child{border-bottom:0}
.b-ep .m{font-family:var(--mono);font-size:12px;font-weight:600;border-radius:6px;text-align:center;padding:2px 0}
.b-ep .m.post{background:#E6EEF6;color:#2B5278}
.b-ep .m.get{background:var(--okbg);color:var(--ok)}
.b-ep .p{font-family:var(--mono);font-size:14px;word-break:break-all}
.b-kf{display:grid;grid-template-columns:1.5fr .8fr 1fr;gap:12px;margin-top:12px}
.b-kf .fld{margin-bottom:10px}
/* 运行 */
.b-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.b-filters select.inp{width:130px;height:34px;font-size:13px}
.b-runin{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 只读 */
.b-roinfo{width:380px;flex:none;display:flex;flex-direction:column;gap:12px}
.b-roinfo .card{padding:18px 20px}
</style>

<body>
<div id="app"></div>
<script src="assets/owa.js"></script>
<script>
"use strict";
/*
 * 构建页（工作室 › 单个智能体）
 * 合并原 /agents?id= 的 6 个 tab、/agents/design、/settings/keys?agent=、/settings/runs?agent=
 * 地址：#orch #eval #pub #acc #run 打开对应阶段；#new-ai 智能体设计器生成；#new-blank 空白手填
 *       ?ro=1 只读视图；?id=fx-helper 被分享（可编辑、非所有者）；?id=contract-diff-copy 克隆出的副本
 */

/* ================= 地址与模式 ================= */
const QS = new URLSearchParams(location.search);
const AID = QS.get("id") || QS.get("agent") || (QS.get("ro") === "1" ? "contract-diff" : "expense-reviewer");
const RO = QS.get("ro") === "1" || (MY_AGENTS.find((a) => a.id === AID) || {}).own === "shared-read";
const TPL = QS.get("tpl");
const H0 = location.hash.slice(1);
const NEW = H0 === "new-ai" ? "ai" : H0 === "new-blank" ? "blank" : "";
const STAGES = [["orch", "编排"], ["eval", "评测"], ["pub", "发布"], ["acc", "接入"], ["run", "运行"]];
const nowT = () => new Date().toTimeString().slice(0, 8);
const nowD = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${d.toTimeString().slice(0, 5)}`; };

/* ================= 常量与演示数据 ================= */
const SECS = [
  ["identity", "名称与头像", "user"], ["prompt", "提示词", "text"], ["model", "模型", "cpu"], ["ability", "能力", "tool"],
  ["knowledge", "知识", "book"], ["vars", "变量与密钥", "key"], ["contract", "输入输出契约", "brace"],
  ["approval", "审批与权限", "shield"], ["webhook", "Webhook", "hook"],
];
const PERMS = [
  ["default", "询问权限", "调用需审批的工具前停下来问人"],
  ["acceptEdits", "自动接受编辑", "文件编辑自动通过，其余照常询问"],
  ["plan", "规划模式", "只出计划，不执行任何改动"],
  ["auto", "自动判定", "由模型判断这一步是否需要询问"],
  ["bypass", "跳过权限检查", "全部放行，不再询问"],
  ["dontAsk", "从不询问", "不询问；遇到需审批的操作直接拒绝"],
];
const UNATT = [["entry", "按入口默认", "接口调用放行，其余入口等人审批"], ["deny", "一律拒绝", "无人值守时需审批的操作全部拒绝"], ["allow", "一律放行", "无人值守时需审批的操作全部放行"]];
const MODELS = [
  { v: "claude-sonnet-4-5", p: "输入 300 / 输出 1500 积分每百万 token", g: "anthropic" },
  { v: "claude-opus-4-1", p: "输入 1500 / 输出 7500 积分每百万 token", g: "anthropic" },
  { v: "claude-haiku-4-5", p: "输入 100 / 输出 500 积分每百万 token", g: "anthropic" },
  { v: "qwen-max", l: "qwen-max（内网代理）", p: "输入 240 / 输出 960 积分每百万 token", g: "proxy" },
  { v: "@default", l: "跟随平台默认（别名 default，当前指向 claude-sonnet-4-5）", p: "", g: "anthropic" },
];
const DEPRECATED = { "claude-3-7-sonnet": true };
const EFFORTS = [["", "跟随模型默认"], ["low", "低"], ["medium", "中"], ["high", "高"]];
const COLORS = ["#F2B49B", "#C8C2E8", "#CADBCF", "#E7D2AA", "#B9D0E8", "#F4B3C3", "#B8DCD6"];
const GROUPS = [["财务部", 12], ["法务部", 5], ["市场部", 9], ["平台组", 7]];
const MY_IDS = MY_AGENTS.map((a) => a.id).concat(MARKET.map((m) => m.id));

const PROMPT0 = `# 角色
你是公司财务的报销初审员，读取发票和报销单，按公司制度给出初审结论。
## 规则
1. 单笔超过 5000 元需要部门负责人审批
2. 发票抬头必须是公司全称「星河数据科技有限公司」
3. 外币按开票日汇率换算
## 输出
给出 verdict（pass / reject / need_approval）与 reasons，引用制度条款编号。
所属部门：{{DEPT}}`;
const IN_SCHEMA = `{
  "type": "object",
  "required": ["invoice_url", "amount", "currency"],
  "properties": {
    "invoice_url": { "type": "string" },
    "amount": { "type": "number" },
    "currency": { "type": "string" }
  }
}`;
const OUT_SCHEMA = `{
  "type": "object",
  "required": ["verdict", "reasons"],
  "properties": {
    "verdict": { "enum": ["pass", "reject", "need_approval"] },
    "reasons": { "type": "array", "items": { "type": "string" } }
  }
}`;
const OUT_EXAMPLE = `{
  "type": "object",
  "required": ["answer"],
  "properties": {
    "answer": { "type": "string" },
    "confidence": { "type": "number" }
  }
}`;
const SKILL_MD = `---
name: invoice-ocr
description: 识别发票字段（抬头、税号、金额、日期）
---
# 识别发票
1. 用 Read 打开发票图片或 PDF
2. 按 templates/fields.json 的字段顺序抽取
3. 金额保留两位小数，日期统一成 YYYY-MM-DD
4. 识别不出的字段填 null，不要猜`;
const EMPTY = () => ({ name: "", id: "", color: "#E6E1D6", desc: "", starters: "", prompt: "", model: "@default", turns: 20, effort: "", params: "", sources: [], tools: "", skills: [], mcp: [], subs: [], docs: [], vars: [], inSchema: "", outSchema: "", perm: "default", unattended: "entry", apTools: "", apCmds: "", webhook: "" });

function expenseData() {
  return {
    name: "报销审核助手", id: "expense-reviewer", color: "#F2B49B",
    desc: "读取发票和报销单，按公司制度做初审，超额提醒审批",
    starters: "这张 6800 元的机票能报吗？\n帮我看看这张发票抬头对不对\n美元发票怎么换算成人民币",
    prompt: PROMPT0, model: "claude-sonnet-4-5", turns: 20, effort: "medium",
    params: '{\n  "effort": "medium",\n  "approvalRules": { "all": false }\n}',
    sources: [{ id: "fx-helper", skills: ["fx-rates"], mcp: ["boc-fx"] }],
    tools: "Read, Grep, WebFetch",
    skills: [
      { n: "invoice-ocr", d: "识别发票字段（抬头、税号、金额、日期）时使用", md: SKILL_MD, files: [{ p: "templates/fields.json", c: '["抬头","税号","金额","币种","开票日期"]' }, { p: "scripts/normalize.py", c: "def normalize(amount):\n    return round(float(amount), 2)" }] },
      { n: "policy-lookup", d: "需要引用报销制度条款时使用", md: "---\nname: policy-lookup\ndescription: 按问题查询报销制度条款\n---\n# 查条款\n先在知识库检索，再按条款编号引用原文。", files: [] },
    ],
    mcp: [{ n: "erp-finance", type: "http", url: "https://erp.example.com/mcp", cmd: "", args: "", env: "{}", test: null }],
    subs: [{ n: "currency-converter", d: "遇到外币发票、需要按开票日汇率换算时使用", m: "", p: "你负责把外币金额按开票日汇率换算成人民币。必须使用调用方给出的开票日期，查不到当天汇率时取前一个工作日。" }],
    docs: [
      { t: "差旅报销制度 2026 版.pdf", m: "PDF，18 页", w: 12000, body: "第 7 条 单笔超过 5,000 元的报销需部门负责人审批。\n第 9 条 市内交通：出差期间打车费凭行程单与发票报销，单程超过 200 元需注明事由。\n第 10 条 网约车发票抬头须为公司全称，个人抬头不予报销。\n第 12 条 餐饮标准：一线城市每人每餐 150 元，其他城市 100 元。" },
      { t: "发票抬头规范.docx", m: "docx，2 页", w: 2140, body: "公司全称：星河数据科技有限公司。\n税号：91110108MA01XH2026。\n分公司发票须写分公司全称，不得简写。" },
      { t: "常见问题", m: "手动添加", w: 860, body: "夜间加班 21:00 后打车回家可报，需附加班审批记录。\n电子发票重复打印不影响报销，但同一发票号只能报一次。" },
    ],
    vars: [{ n: "ERP_TOKEN", d: "ERP 接口令牌", req: true, sec: true }, { n: "DEPT", d: "所属部门，例如 市场部", req: false, sec: false }],
    inSchema: IN_SCHEMA, outSchema: OUT_SCHEMA,
    perm: "default", unattended: "entry", apTools: "erp-finance.submit", apCmds: "rm -rf *, curl * | sh",
    webhook: "https://hooks.xinghe.example/owa",
  };
}
function fxData() {
  return Object.assign(EMPTY(), {
    name: "汇率换算", id: "fx-helper", color: "#B8DCD6", desc: "按开票日查询汇率并换算",
    starters: "USD 420，开票日 10-15，折合多少人民币？\n欧元发票怎么换算",
    prompt: "# 角色\n你负责把外币金额按开票日汇率换算成人民币。\n## 规则\n1. 必须使用开票日的中国银行中间价\n2. 结果保留两位小数",
    model: "claude-3-7-sonnet", turns: 8, tools: "WebFetch",
    docs: [{ t: "汇率数据源说明", m: "手动添加", w: 420, body: "优先使用中国银行外汇牌价中间价。" }],
    webhook: "https://hooks.finance.example/fx",
  });
}

function caseFields(c, px) {
  return `<div class="b-cf"><div class="grid2">${fld("用例名 <b>*</b>", `<input class="inp" id="${px}-n" value="${esc(c.n)}">`)}${fld("结构化字段等于（每行「路径 = 值」）", `<textarea class="ta b-taM" rows="2" id="${px}-eq" placeholder='verdict = "reject"'>${esc(c.eq)}</textarea>`)}</div>
    ${fld("输入 <b>*</b>", `<textarea class="ta b-taM" rows="2" id="${px}-in">${esc(c.input)}</textarea><span class="b-err" id="${px}-inerr"></span>`)}
    <div class="row small" style="margin-bottom:12px;gap:18px;flex-wrap:wrap"><label class="b-ck"><input type="checkbox" id="${px}-json" ${c.json ? "checked" : ""}>输入按 JSON 对象解析${S.data.inSchema && c.json ? "（有 inputSchema，默认勾选）" : ""}</label><label class="b-ck"><input type="checkbox" id="${px}-ok" ${c.ok ? "checked" : ""}>期望运行成功（取消表示期望失败）</label></div>
    <div class="grid2">${fld("正文须包含（每行一个）", `<textarea class="ta" rows="2" id="${px}-must">${esc(c.must)}</textarea>`)}${fld("正文不得包含（每行一个）", `<textarea class="ta" rows="2" id="${px}-not">${esc(c.mustNot)}</textarea>`)}</div>
    <div class="grid2">${fld("花费上限（美元，正数，可选）", `<input class="inp" id="${px}-cost" value="${esc(c.cost)}">`)}${fld("耗时上限（秒，正数，可选）", `<input class="inp" id="${px}-time" value="${esc(c.time)}">`)}</div>
    <div class="b-err" id="${px}-err" style="margin-bottom:6px"></div></div>`;
}
function readCase(px) {
  const g = (s) => $(`#${px}-${s}`);
  const c = { n: g("n").value.trim(), input: g("in").value.trim(), json: g("json").checked, ok: g("ok").checked, must: g("must").value.trim(), mustNot: g("not").value.trim(), eq: g("eq").value.trim(), cost: g("cost").value.trim(), time: g("time").value.trim() };
  let err = "";
  if (!c.n) err = "用例名不能为空";
  else if (!c.input) err = "输入不能为空";
  else if (c.json) { try { const j = JSON.parse(c.input); if (!j || typeof j !== "object" || Array.isArray(j)) err = "输入必须是 JSON 对象"; } catch (_) { err = "输入不是合法 JSON；取消勾选「按 JSON 对象解析」可当作文本"; } }
  if (!err && c.cost && !(+c.cost > 0)) err = "花费上限必须是正数";
  if (!err && c.time && !(+c.time > 0)) err = "耗时上限必须是正数";
  if (!err && c.eq && c.eq.split("\n").some((l) => l.trim() && !l.includes("="))) err = "结构化字段每行要写成「路径 = 值」";
  g("err").textContent = err;
  return err ? null : c;
}
function caseAssert(c) {
  const a = [];
  if (!c.ok) a.push("期望运行失败");
  if (c.eq) a.push(c.eq.split("\n").filter(Boolean).join("，"));
  if (c.must) a.push("须包含「" + c.must.split("\n").filter(Boolean).join("」「") + "」");
  if (c.mustNot) a.push("不得包含「" + c.mustNot.split("\n").filter(Boolean).join("」「") + "」");
  if (c.cost) a.push(`≤ $${c.cost}`);
  if (c.time) a.push(`≤ ${c.time}s`);
  return a.join("；") || "只要求运行成功";
}

function evalView() {
  const n = S.cases.length, p = passN();
  const fails = S.cases.filter((c) => S.caseSt[c.n] && S.caseSt[c.n].s === "fail");
  const ver = S.shownTarget !== "草稿";
  let ban = "";
  if (!n) ban = `<div class="banner info">${ic("info", 18)}<div>还没有用例。在编排的「试聊」里点回复下方的「存为评测用例」，或在这里手动添加。发布至少需要 1 个用例。</div></div>`;
  else if (S.evalState === "running") ban = `<div class="banner info"><span class="spin"></span><div>正在对<b>${S.shownTarget}</b>运行 ${n} 个用例，逐个真实调用模型。</div></div>`;
  else if (ver) ban = `<div class="banner info">${ic("info", 18)}<div>下面显示的是对 <b>${S.shownTarget}</b> 的评测结果，<b>不影响</b>发布门槛；发布看的是对当前草稿的评测。</div><button class="btn ghost sm" style="margin-left:auto" data-a="show-draft">看草稿的结果</button></div>`;

document.addEventListener("input", (e) => {

  if (v === "id") $("#err-id").textContent = idErr(t.value.trim());

function bindDrop() {

  d.ondragleave = () => d.classList.remove("on");

}
async function doUpload(files) {
  if (!files.length) return;
  S.upl = files.map((f) => ({ name: f.name, size: f.size, st: "run", msg: "正在提取文字…" }));
  R("r");
  for (const u of S.upl) {
    await later(500);
    const ext = (u.name.split(".").pop() || "").toLowerCase();
    if (!["pdf", "docx", "pptx", "xlsx", "txt", "md", "csv"].includes(ext)) { u.st = "bad"; u.msg = "不支持的格式（支持 PDF、docx、pptx、xlsx、文本）"; }
    else if (u.size > 20 * 1024 * 1024) { u.st = "bad"; u.msg = `${(u.size / 1048576).toFixed(0)}MB，超过单个 20MB 上限`; }
    else {
      const big = u.size > 5e6, pages = Math.max(1, Math.round(u.size / 6e4)), w = Math.round(u.size / 30);
      u.st = "ok"; u.msg = `${pages} 页，${w.toLocaleString()} 字${big ? "，较长，已自动切成 2 篇" : ""}`;
      if (big) { S.data.docs.push({ t: u.name.replace(/\.\w+$/, "") + "（1/2）", m: ext.toUpperCase() + "，" + Math.ceil(pages / 2) + " 页", w: Math.round(w / 2), body: "（提取出的文字）" }, { t: u.name.replace(/\.\w+$/, "") + "（2/2）", m: ext.toUpperCase() + "，" + Math.floor(pages / 2) + " 页", w: Math.round(w / 2), body: "（提取出的文字）" }); }
      else S.data.docs.push({ t: u.name, m: ext.toUpperCase() + "，" + pages + " 页", w, body: "（提取出的文字）" });
    }
    R("r");
  }
  touch("knowledge"); R("hr");
  setTimeout(() => { S.upl = S.upl.filter((u) => u.st === "bad"); R("r"); }, 4000);
}
