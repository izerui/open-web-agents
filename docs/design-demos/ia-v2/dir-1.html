<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Web Agents 交互样例</title>
  <!--
  方向 A：Alan Cooper 目标导向。五项工作决定一级导航，会话属于工作台。
  桌面距离、安静的操作界面；容量为一段对话、三次工具过程、一份待回答问题。
  文件与执行详情随任务打开，不设永久右栏。所有数据为本地交互样例。
  图标由已安装 lucide-react 经 react-dom/server 渲染，机械内嵌，无外部请求。
  -->
  <style>
    :root{color-scheme:dark;--bg:#1e1f22;--panel:#2b2d30;--line:#393b40;--text:#dfe1e5;--muted:#a7abb3;--blue:#3574f0;--bright:#548af7;--selected:#2e436e;--green:#5fb865;--red:#db5c5c;--amber:#e0b153}
    *{box-sizing:border-box;letter-spacing:0}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:1px solid transparent;border-radius:6px;background:transparent;min-height:44px;padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    button:hover{background:#35373b}button:disabled{opacity:1;color:#b8bdc7;background:#393b40;border-color:#50535a;cursor:not-allowed}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--bright);outline-offset:3px}
    svg{flex:none;vertical-align:middle}h1,h2,h3,p{margin:0;overflow-wrap:anywhere}h1{font-size:20px;font-weight:600;line-height:1.4}h2{font-size:17px;font-weight:600}h3{font-size:14px;font-weight:600}
    small,.caption{font-size:12px;color:var(--muted)}p+p{margin-top:12px}
    input,select,textarea{background:var(--bg);border:1px solid #50535a;border-radius:6px;padding:10px 12px;width:100%;min-width:0;min-height:44px}
    textarea{resize:vertical;line-height:1.7;min-height:110px}
    label{display:grid;gap:7px}input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:18px;min-height:18px;margin:0}
    .check{display:flex;align-items:center;gap:10px;min-height:44px}.muted{color:var(--muted)}.good{color:var(--green)}.bad{color:#ef8888}.warning{color:var(--amber)}
    .row{display:flex;align-items:center;gap:10px;min-width:0}.spread{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
    .primary{background:#306bdc;color:#fff}.primary:hover{background:#2962d5}.outline{border-color:#50535a}.icon{width:44px;padding:10px;flex:none}
    .pill{border:1px solid var(--line);padding:3px 8px;border-radius:4px;font-size:12px;white-space:nowrap;color:var(--muted)}
    .brand{display:flex;align-items:center;gap:9px;font-weight:600}.mark{background:#306bdc;color:#fff;display:grid;place-items:center;width:30px;height:30px;border-radius:6px;font-size:13px;font-weight:700;flex:none}
    .topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
    .topbar .brand{font-size:14px}.top-actions{display:flex;align-items:center;gap:8px}.search-trigger{color:var(--muted)}
    .shell{display:grid;grid-template-columns:176px minmax(0,1fr);gap:6px;padding:0 6px 6px;height:calc(100dvh - 54px)}
    .global{background:var(--panel);border-radius:12px;padding:16px 8px 8px;display:flex;flex-direction:column;min-height:0}
    .nav-label{font-size:12px;color:var(--muted);padding:0 12px 12px}.nav-item{width:100%;justify-content:flex-start;padding:10px 12px;margin-bottom:4px;min-height:48px}
    .nav-item.active{background:var(--selected);color:#fff}.nav-item.active svg{color:#94b8ff}.nav-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
    .identity{display:flex;align-items:center;gap:9px;width:100%;justify-content:flex-start}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#42454a;flex:none}
    #main{min-width:0;min-height:0;position:relative}.panel{border-radius:12px;background:var(--panel);overflow:hidden}
    .workbench{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr);gap:6px}
    .sessions{padding:15px 10px;display:flex;flex-direction:column;min-height:0}.sessions h2{font-size:14px}.sessions .outline{margin:14px 0 20px}
    .session-list{overflow:auto}.session-item{width:100%;display:block;text-align:left;margin-bottom:7px;padding:12px;line-height:1.7}
    .session-item strong{display:block;font-size:14px;font-weight:500}.session-item small{display:block;margin-top:4px}.session-item.active{background:var(--selected)}.session-item.active small{color:#c3c9d4}
    .session-foot{margin-top:auto;padding:16px 10px 4px;color:var(--muted);font-size:12px}
    .conversation{display:flex;flex-direction:column;min-height:0;position:relative}
    .conversation-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}
    .conversation-head h1{font-size:16px}.conversation-head .subtitle{margin-top:4px}.transcript{flex:1;overflow:auto;padding:20px max(24px,calc((100% - 800px)/2));scrollbar-width:thin}
    .message{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;margin-bottom:20px}.message .byline{font-weight:600;margin:2px 0 10px}.message p{line-height:1.85}
    .agent-avatar{background:var(--selected);color:#a8c5ff;border-radius:7px}.user-avatar{font-size:12px}
    .tool-summary{margin:12px 0;border-block:1px solid var(--line)}
    .tool-line{display:flex;align-items:center;gap:9px;min-height:34px;font-size:14px}.tool-line code{color:var(--muted);font-size:12px;margin-left:auto}.tool-summary button{padding-left:0;color:var(--muted);font-size:14px}
    .files{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.file-chip{border:1px solid #50535a;font:12px ui-monospace,monospace;justify-content:flex-start}.file-chip svg{color:var(--muted)}
    .question{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
    .choice{padding:9px 12px;border:1px solid #50535a;border-radius:6px;min-height:44px;cursor:pointer}.choice:has(input:checked){border-color:var(--bright);background:var(--selected)}
    .question-footer{display:flex;justify-content:space-between;align-items:center;gap:10px}.question-footer small{color:var(--amber)}
    .composer-wrap{padding:10px 24px 16px}.composer{border:1px solid #565961;background:var(--bg);border-radius:10px;padding:10px 14px;max-width:800px;margin:auto}
    .composer textarea{border:0;min-height:44px;height:44px;max-height:140px;padding:0;resize:none;background:transparent}.composer-bottom{display:flex;align-items:center;justify-content:space-between}
    .composer-note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}.blank{padding:55px 12px;text-align:center;color:var(--muted)}.blank svg{margin-bottom:12px}.blank h2{color:var(--text);margin-bottom:8px}
    .page{height:100%;display:flex;flex-direction:column}.page-head{padding:26px 32px 20px;border-bottom:1px solid var(--line)}.page-head p{margin-top:5px;color:var(--muted)}
    .page-body{padding:24px 32px;overflow:auto;flex:1;min-height:0}.section{max-width:940px;margin:0 auto}.section.wide{max-width:1100px}
    .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.toolbar input{max-width:330px}.toolbar select{width:auto;max-width:100%}
    .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);padding:0 32px;overflow:auto;flex:none;scrollbar-width:thin}
    .tab{white-space:nowrap;border-radius:0;color:var(--muted);border-bottom:2px solid transparent;padding:14px 4px}.tab.active{border-bottom-color:var(--bright);color:#fff}
    .agent-list{border-top:1px solid var(--line)}.agent-row{border-bottom:1px solid var(--line);padding:22px 0;display:flex;align-items:center;gap:16px}.agent-row .agent-avatar{width:42px;height:42px;display:grid;place-items:center}
    .agent-row h2{font-size:16px}.agent-row p{margin-top:4px;color:var(--muted)}.agent-row button{margin-left:auto}
    .form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:24px}.full{grid-column:1/-1}.field-help{color:var(--muted);font-size:12px}
    .section-heading{margin:28px 0 14px}.section-heading:first-child{margin-top:0}.help-line{border-bottom:1px solid var(--line);padding-bottom:18px;color:var(--muted)}
    .savebar{border-top:1px solid var(--line);padding:13px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .notice{padding:12px 0;color:var(--muted)}.notice svg{margin-right:8px}.notice.warning{color:var(--amber)}
    .details-list details{border-bottom:1px solid var(--line);padding:12px 0}summary{min-height:44px;cursor:pointer;padding:10px 0}
    .data-list{border-top:1px solid var(--line)}.data-row{width:100%;border-radius:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 110px 80px 24px;text-align:left;gap:18px;padding:18px 10px}
    .data-row strong{font-weight:500;display:block}.data-row small{display:block}.table-head{color:var(--muted);font-size:12px;min-height:40px;padding-block:8px}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line);margin-bottom:26px;padding:6px 0 24px}
    .metric{padding:0 25px;border-left:1px solid var(--line)}.metric:first-child{padding-left:0;border:0}.metric strong{font-size:30px;font-weight:500;display:block;margin-top:8px}
    pre{font:13px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0;max-width:100%}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
    dialog{background:var(--panel);color:var(--text);border:1px solid #50535a;border-radius:12px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
    dialog::backdrop{background:#0009}dialog .dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
    .dialog-body{padding:20px;overflow:auto}.dialog-body label+label{margin-top:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    #drawer{margin:6px 6px 6px auto;height:calc(100dvh - 12px);max-height:none;width:min(460px,calc(100vw - 12px))}
    #drawer .dialog-body{height:calc(100% - 73px)}.search-result{display:flex;width:100%;justify-content:space-between;border-bottom:1px solid var(--line);border-radius:0}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#dfe1e5;color:#1e1f22;border-radius:6px;z-index:20;max-width:calc(100vw - 32px);box-shadow:0 6px 24px #0006}
    #toast:empty{display:none}.mobile-only{display:none}.inline-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.divider{border-top:1px solid var(--line);margin:24px 0}
    .mobile-menu .nav-item{margin:0}.mobile-menu .identity{margin-top:12px}.knowledge-item{padding:14px 0;border-bottom:1px solid var(--line)}
    @media(max-width:1000px){.conversation-head{padding:16px}.transcript{padding:24px 18px}.composer-wrap{padding:12px 16px}.workbench{grid-template-columns:210px minmax(0,1fr)}.head-actions .button-text{display:none}}
    @media(max-width:760px){
      body{font-size:16px}.topbar{height:58px;padding:0 10px;gap:5px}.topbar .brand{font-size:12px;gap:7px}.topbar .mark{width:27px;height:27px;font-size:11px}
      .top-actions{gap:0}.topbar .pill{padding:2px 6px;font-size:12px}.search-trigger{width:44px;padding:10px}.search-trigger span:last-child{display:none}
      .shell{height:calc(100dvh - 58px);display:block;padding:0 6px 6px}.global{display:none}.mobile-only{display:inline-flex}
      #main{height:100%}.workbench{display:block}.sessions{display:none}.conversation{height:100%}.conversation-head{padding:12px;gap:4px;align-items:flex-start}
      .conversation-head h1{font-size:15px}.conversation-head .subtitle{font-size:12px}.head-actions{gap:0}.head-actions button{width:44px;padding:10px}
      .transcript{padding:22px 14px}.message{gap:9px;grid-template-columns:26px minmax(0,1fr);margin-bottom:24px}.message .avatar{width:26px;height:26px}
      .message p{line-height:1.8}.tool-line{font-size:13px;flex-wrap:wrap;gap:7px;padding:5px 0}.tool-line code{margin-left:0}.files{gap:6px}.file-chip{font-size:12px;padding:7px}
      .composer-wrap{padding:8px 12px 12px}.composer{padding:10px}.composer textarea{font-size:16px;min-height:44px}.composer-note{font-size:12px}.composer-bottom .caption{max-width:210px}
      .question-footer{align-items:flex-start;flex-wrap:wrap}.page-head{padding:20px 18px 16px}.page-head .row{flex-wrap:wrap}.page-head h1{font-size:20px}
      .page-body{padding:20px 18px}.tabs{padding:0 18px;gap:18px}.tab{font-size:14px}.form-grid{grid-template-columns:1fr;gap:18px}.full{grid-column:auto}
      .agent-row{align-items:flex-start;gap:10px;flex-wrap:wrap}.agent-row .grow{min-width:180px}.agent-row button{margin-left:52px}
      .savebar{padding:12px 18px;flex-wrap:wrap;font-size:13px}.toolbar{gap:10px}.toolbar input{max-width:none}.data-row{grid-template-columns:minmax(0,1fr) 64px;gap:8px;padding:15px 0}.data-row .source{grid-row:2;font-size:12px}.data-row>svg{display:none}
      .metrics{gap:12px}.metric{padding:0 0 0 12px}.metric strong{font-size:24px}.metric .caption{font-size:12px}.dialog-body{padding:18px}pre{font-size:12px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="row">
      <button class="icon mobile-only" data-action="navigation" aria-label="打开导航" title="打开导航"><span data-icon="PanelLeft"></span></button>
      <div class="brand"><span class="mark">OW</span><span>Open Web Agents</span></div>
    </div>
    <div class="top-actions"><span class="pill">交互样例</span><button id="search-trigger" class="search-trigger" data-action="search" aria-label="搜索目的地" title="搜索目的地"><span data-icon="Search"></span><span>搜索</span></button></div>
  </header>
  <div class="shell">
    <nav class="global" aria-label="主导航" id="global-nav"></nav>
    <main id="main"></main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title" closedby="any"></dialog>
  <dialog id="drawer" aria-labelledby="drawer-title" closedby="any"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const ICONS = {
  "MessageSquare": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-message-square\" aria-hidden=\"true\"><path d=\"M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z\"></path></svg>",
  "Bot": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-bot\" aria-hidden=\"true\"><path d=\"M12 8V4H8\"></path><rect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"></rect><path d=\"M2 14h2\"></path><path d=\"M20 14h2\"></path><path d=\"M15 13v2\"></path><path d=\"M9 13v2\"></path></svg>",
  "Activity": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-activity\" aria-hidden=\"true\"><path d=\"M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2\"></path></svg>",
  "KeyRound": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-key-round\" aria-hidden=\"true\"><path d=\"M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z\"></path><circle cx=\"16.5\" cy=\"7.5\" r=\".5\" fill=\"currentColor\"></circle></svg>",
  "Wallet": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-wallet\" aria-hidden=\"true\"><path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\"></path><path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"></path></svg>",
  "Settings": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-settings\" aria-hidden=\"true\"><path d=\"M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915\"></path><circle cx=\"12\" cy=\"12\" r=\"3\"></circle></svg>",
  "Search": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-search\" aria-hidden=\"true\"><path d=\"m21 21-4.34-4.34\"></path><circle cx=\"11\" cy=\"11\" r=\"8\"></circle></svg>",
  "Plus": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-plus\" aria-hidden=\"true\"><path d=\"M5 12h14\"></path><path d=\"M12 5v14\"></path></svg>",
  "PanelLeft": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-panel-left\" aria-hidden=\"true\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"></rect><path d=\"M9 3v18\"></path></svg>",
  "X": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-x\" aria-hidden=\"true\"><path d=\"M18 6 6 18\"></path><path d=\"m6 6 12 12\"></path></svg>",
  "ArrowUp": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up\" aria-hidden=\"true\"><path d=\"m5 12 7-7 7 7\"></path><path d=\"M12 19V5\"></path></svg>",
  "ChevronRight": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"></path></svg>",
  "FileText": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-file-text\" aria-hidden=\"true\"><path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\"></path><path d=\"M14 2v5a1 1 0 0 0 1 1h5\"></path><path d=\"M10 9H8\"></path><path d=\"M16 13H8\"></path><path d=\"M16 17H8\"></path></svg>",
  "Folder": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-folder\" aria-hidden=\"true\"><path d=\"M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z\"></path></svg>",

    let modalInvoker=null,drawerInvoker=null;
    function openDialog(title,body,drawer=false){
      const target=drawer?$('#drawer'):$('#modal');
      if(!target.open){if(drawer)drawerInvoker=document.activeElement;else modalInvoker=document.activeElement;}
      target.innerHTML=`<div class="dialog-head"><h2 id="${drawer?'drawer':'modal'}-title">${title}</h2>${iconBtn('关闭',drawer?'close-drawer':'close-modal','X')}</div><div class="dialog-body">${body}</div>`;
      if(!target.open)target.showModal();
    }
    function closeDialogs(){for(const id of ['modal','drawer'])if($('#'+id).open)$('#'+id).close();}
    $('#modal').addEventListener('close',()=>modalInvoker?.isConnected&&modalInvoker.focus({preventScroll:true}));
    $('#drawer').addEventListener('close',()=>drawerInvoker?.isConnected&&drawerInvoker.focus({preventScroll:true}));
    for(const id of ['modal','drawer']){
      $('#'+id).addEventListener('keydown',event=>{
        if(event.key==='Escape'){event.preventDefault();event.stopPropagation();event.currentTarget.close();}
      });
    }
    function filesDrawer(file){
      if(!currentSession().sample){openDialog('会话文件',empty('暂无文件','当前会话尚未生成文件。'),true);return;}
      if(file)state.file=file;
      openDialog('会话文件',`<div class="details-list"><details open><summary>3 份交付文件</summary>${Object.keys(fileContents).map(f=>`<button class="search-result" data-action="file:${f}">${icon('FileText')}<span class="grow">${f}</span>${f===state.file?icon('Check'):''}</button>`).join('')}</details></div><h3 class="section-heading">${esc(state.file)}</h3><pre>${esc(fileContents[state.file])}</pre>${btn('下载文件','download','Download','outline')}`,true);
    }
    function toolsDrawer(){
      openDialog('执行详情',!currentSession().sample?empty('暂无执行记录','消息保留为本地草稿，尚未执行。','Terminal'):
      `<span class="pill">交互样例</span><div class="details-list">${[['Read README.md','成功','已读取项目说明。'],['Write src/app.ts','成功','已写入健康检查与用户列表路由入口。'],['Bash pnpm test','失败','尚未配置测试脚本']].map(([name,status,text])=>`<details ${status==='失败'?'open':''}><summary>${name} <span class="${status==='成功'?'good':'bad'}">${status}</span></summary><pre>${text}</pre></details>`).join('')}</div>`,true);
    }
    function openSearch(){
      openDialog('搜索目的地',`<input id="destination-search" type="search" aria-label="搜索目的地" placeholder="搜索工作台、智能体、费用…" autofocus><div id="search-results"></div>`);
      searchResults('');$('#destination-search').focus();
    }
    function searchResults(query){
      const all=[...nav,['admin','平台管理','Shield'],['account','账号设置','UserRound']];
      $('#search-results').innerHTML=all.filter(([,label])=>label.includes(query)).map(([id,label,name])=>`<button class="search-result" data-action="nav:${id}"><span class="row">${icon(name)}${label}</span>${icon('ChevronRight')}</button>`).join('')||empty('没有匹配的目的地','试试“费用”或“智能体”。','Search');
    }
    async function copyText(text){
      try{await navigator.clipboard.writeText(text);toast('已复制');}
      catch{openDialog('复制内容',`<label>可复制内容<textarea id="copy-content" readonly rows="8">${esc(text)}</textarea></label>`);$('#copy-content').select();}
    }
    document.addEventListener('click',event=>{
      const control=event.target.closest('[data-action]');if(!control)return;
      const [action,...parts]=control.dataset.action.split(':');const value=parts.join(':');
      if(action==='nav')go(value);
      else if(action==='navigation')openDialog('工作空间',`<nav class="mobile-menu">${navigationHTML()}</nav>`);
      else if(action==='search')openSearch();
      else if(action==='close-modal')$('#modal').close();
      else if(action==='close-drawer')$('#drawer').close();
      else if(action==='account-menu')openDialog('个人账号',`<p class="muted">${esc(data.accountName)}</p>${btn('账号安全','account-section:账号安全','UserRound','nav-item')}${btn('操作日志','account-section:操作日志','Activity','nav-item')}`);
      else if(action==='account-section'){state.accountTab=value;go('account');}
      else if(action==='sessions')openDialog('会话',`${btn('新建会话','new-session','Plus','outline')}<div class="session-list">${sessionItems()}</div>`);
      else if(action==='session'){state.session=Number(value);state.choice='';closeDialogs();render();}
      else if(action==='new-session'){const id=Date.now();data.sessions.unshift({id,title:'新会话',sample:false,messages:[],answer:''});state.session=id;state.choice='';persist();go('workbench');$('#message-input').focus();}
      else if(action==='files'||action==='file')filesDrawer(value);
      else if(action==='tools')toolsDrawer();
      else if(action==='download'){const url=URL.createObjectURL(new Blob([fileContents[state.file]],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=state.file.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载样例文件');}
      else if(action==='agent'){state.agent=Number(value);state.detail=true;state.agentTab='配置';render();}
      else if(action==='agent-list'){state.detail=false;render();}
      else if(action==='create-agent')openDialog('创建智能体',`<form id="create-agent-form"><label>名称<input name="name" required maxlength="40" autofocus></label><label>职责<textarea name="description" required rows="3"></textarea></label><div class="dialog-actions"><button class="primary">创建草稿</button></div></form>`);
      else if(action==='agent-tab'){state.agentTab=value;render();}
      else if(action==='save-agent')saveAgent();
      else if(action==='assist')openDialog('辅助编辑',`<p class="muted">建议将交付标准补充到系统指令中。</p><pre>完成任务后，列出交付文件、验证步骤与未解决的问题。</pre><div class="dialog-actions">${btn('加入系统指令','apply-assist','Plus','primary')}</div>`);
      else if(action==='apply-assist'){const a=currentAgent();a.prompt+='\n完成任务后，列出交付文件、验证步骤与未解决的问题。';a.saved=false;persist();closeDialogs();state.agentTab='配置';render();toast('建议已加入草稿');}
      else if(action==='add-knowledge')openDialog('添加知识文档',`<form id="knowledge-form"><label>文档名称<input name="title" required maxlength="100"></label><label>文档内容<textarea name="content" required rows="7"></textarea></label><div class="dialog-actions"><button class="primary">添加到草稿</button></div></form>`);
      else if(action==='remove-knowledge'){currentAgent().knowledge.splice(Number(value),1);currentAgent().saved=false;persist();render();}
      else if(action==='eval-agent'){currentAgent().evaluated=true;persist();render();}
      else if(action==='publish-agent'){
        if(!currentAgent().saved){toast('请先保存草稿');return;}
        openDialog('确认发布样例',`<h3>${esc(currentAgent().name)}</h3><p class="notice">可见范围：${esc(currentAgent().visibility||'仅自己')}</p><p>仅生成发布预览，不会向平台发布。</p><div class="dialog-actions">${btn('确认生成','confirm-publish','Check','primary')}</div>`);
      }
      else if(action==='confirm-publish'){currentAgent().published=true;log('生成智能体发布样例');closeDialogs();render();toast('发布样例已生成');}
      else if(action==='run'){const r=runs[Number(value)];openDialog('运行详情',`<h2>${r.title}</h2><p class="notice">来源：${r.source}</p><p class="muted">状态：${r.status}</p><h3 class="section-heading">输入</h3><p>${r.input}</p><h3 class="section-heading">${r.status==='失败'?'失败说明':'输出'}</h3><pre>${r.output}</pre>${r.source==='工作台'?btn('打开关联会话','session-run','MessageSquare','outline'):''}`,true);}
      else if(action==='session-run'){state.session=1;go('workbench');}
      else if(action==='api-tab'){state.apiTab=value;render();}
      else if(action==='copy-snippet')copyText(snippet());
      else if(action==='create-key')openDialog('签发样例密钥',`<form id="key-form"><label>密钥名称<input name="name" required maxlength="40" value="开发环境"></label><p class="notice">关联智能体：${esc(data.agents.find(a=>a.id===state.apiAgent).name)}</p><p class="muted">生成的 demo 值不可用于接口调用。</p><div class="dialog-actions"><button class="primary">签发样例</button></div></form>`);
      else if(action==='revoke-key'){data.keys=data.keys.filter(k=>k.id!==Number(value));log('撤销样例密钥');render();toast('样例密钥已撤销');}
      else if(action==='webhook-test'){if(!data.webhook){toast('请先保存回调地址');return;}data.delivery=true;persist();render();}
      else if(action==='billing-tab'){state.billingTab=value;render();}
      else if(action==='confirm-order'){data.orders.push({amount:state.orderAmount,cancelled:false});log('生成充值订单样例');closeDialogs();render();toast('订单样例已生成，未发起支付');}
      else if(action==='cancel-order'){data.orders[Number(value)].cancelled=true;persist();render();}
      else if(action==='admin-tab'){state.adminTab=value;render();}
      else if(action==='admin-permissions')openDialog('管理员权限',`<p>样例身份可预览账号、模型与算力、计费与运营审计。</p><p class="notice">当前没有真实权限变更。</p>`);
      else if(action==='account-tab'){state.accountTab=value;render();}
    });
    function saveAgent(){
      const a=currentAgent();
      if(!a.name.trim()||!a.prompt.trim()){toast('请填写名称与系统指令');return;}
      if(!Number.isInteger(Number(a.turns))||Number(a.turns)<1||Number(a.turns)>100){toast('最大轮次需为 1 到 100 的整数');return;}
      for(const key of ['input','output']){try{if(a[key].trim())JSON.parse(a[key]);}catch{toast((key==='input'?'输入':'输出')+'结构不是有效的 JSON');return;}}
      if(['指定用户','用户组'].includes(a.visibility)&&!a.principal?.trim()){toast('请填写分享对象');return;}
      a.saved=true;log('保存智能体原型草稿');render();toast('原型草稿已保存');
    }
    document.addEventListener('input',event=>{
      const el=event.target;
      if(el.dataset.field){const a=currentAgent();a[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;a.saved=false;persist();if($('#save-status'))$('#save-status').textContent='草稿有修改，已在本地保留';}
      if(el.id==='message-input')$('#send-message').disabled=!el.value.trim();
      if(el.id==='destination-search')searchResults(el.value.trim());
      if(el.id==='agent-search'){state.agentQuery=el.value;$('#agent-list').innerHTML=agentRows();}
    });
    document.addEventListener('change',event=>{
      const el=event.target;
      if(el.name==='answer'){state.choice=el.value;$('#answer-submit').disabled=false;}
      if(el.id==='run-source'){state.source=el.value;render();}
      if(el.id==='run-status'){state.status=el.value;render();}
      if(el.id==='api-agent'){state.apiAgent=Number(el.value);render();}
    });
    document.addEventListener('submit',event=>{
      event.preventDefault();const form=event.target;const values=new FormData(form);
      if(form.id==='message-form'){const text=$('#message-input').value.trim();if(!text)return;const s=currentSession();s.messages.push({role:'你',text},{role:'通用智能体',text:'已记录这条消息。本次为交互样例，尚未执行任务。'});if(s.title==='新会话')s.title=Array.from(text).slice(0,24).join('');persist();render();$('#transcript').scrollTop=$('#transcript').scrollHeight;$('#message-input').focus();}
      if(form.id==='question-form'){const s=currentSession();if(!state.choice||s.answer)return;s.answer=state.choice;s.messages.push({role:'你',text:state.choice},{role:'通用智能体',text:'已记录选择：'+state.choice+'。后续实现会以此为依据。'});persist();render();toast('回答已记录');}
      if(form.id==='create-agent-form'){const a={...defaults().agents[0],id:Date.now(),name:values.get('name').trim(),description:values.get('description').trim(),knowledge:[],saved:false};if(!a.name)return;data.agents.push(a);state.agent=a.id;state.detail=true;state.agentTab='配置';persist();closeDialogs();render();}
      if(form.id==='knowledge-form'){currentAgent().knowledge.push({title:values.get('title'),content:values.get('content')});currentAgent().saved=false;persist();closeDialogs();render();}
      if(form.id==='key-form'){data.keys.push({id:Date.now(),name:values.get('name'),value:'demo_NOT_VALID_'+(data.keys.length+1),agent:data.agents.find(a=>a.id===state.apiAgent).name});log('签发样例密钥');closeDialogs();render();toast('样例密钥已生成，不可调用');}
      if(form.id==='webhook-form'){data.webhook=values.get('url');data.delivery=false;log('保存回调配置样例');render();toast('回调配置已保存在原型');}
      if(form.id==='order-form'){state.orderAmount=Number(values.get('amount'));openDialog('确认充值订单',`<p>订单金额：¥ ${state.orderAmount}</p><p class="notice">仅创建样例订单，不会发起支付或增加余额。</p><div class="dialog-actions">${btn('返回','close-modal','','outline')}${btn('创建订单样例','confirm-order','','primary')}</div>`);}
      if(form.id==='account-form'){const name=values.get('name').trim();if(!name){toast('显示名称不能为空');return;}data.accountName=name;log('保存个人资料样例');render();toast('个人资料已保存');}
    });
    render();
  </script>
</body>
</html>
