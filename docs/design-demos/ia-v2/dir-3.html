<style>

*{box-sizing:border-box;letter-spacing:0}

textarea{resize:vertical;min-height:112px}input[type=checkbox],input[type=radio]{width:18px;min-height:18px;accent-color:var(--blue)}
label{display:block}label>input,label>textarea,label>select{margin-top:6px}
svg{width:18px;height:18px;flex-shrink:0;vertical-align:middle}

code,pre{font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.top{height:70px;padding:0 24px;display:flex;align-items:center;gap:30px}.brand{display:flex;align-items:center;gap:10px;font-weight:650;white-space:nowrap}.mark{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--blue);color:white;border-radius:6px;font:700 12px ui-monospace,monospace}
.nav{display:flex;gap:6px;flex:1;align-items:center}.nav button{color:var(--muted)}.nav button.active{background:var(--select);color:var(--text)}.utilities{display:flex;gap:6px;align-items:center}.icon{width:44px;padding:0}.avatar{border:1px solid var(--line);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;background:var(--panel)}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:4px;white-space:nowrap}.good{color:var(--green)}.bad{color:var(--red)}.primary{background:var(--blue);color:white}.primary:hover{background:#2865df}.outline{border-color:var(--line)}.selected{background:var(--select)!important;border-color:var(--bright)!important}
main{margin:0 6px 6px;min-height:calc(100dvh - 76px);border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}

.page{padding:32px 38px;max-width:1440px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:16px}.pagehead p{color:var(--muted);margin-top:4px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow:auto;margin-bottom:28px}.tabs button{border-radius:0;border-bottom:2px solid transparent;color:var(--muted)}.tabs button.active{border-bottom-color:var(--bright);color:var(--text)}.listrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 4px;border-bottom:1px solid var(--line)}.listrow .row>div{min-width:0}.agenticon{width:42px;height:42px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--bright)}.listrow h3{margin-bottom:3px}.formgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:48px}.formstack{display:grid;gap:20px}.aside{border-left:1px solid var(--line);padding-left:28px}.aside p{color:var(--muted);margin-top:10px}.aside button{margin-top:18px}.savebar{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.filters{display:flex;gap:12px;align-items:center;margin-bottom:20px}.filters label{min-width:160px}.filters input{max-width:400px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{color:var(--muted);font-size:12px;font-weight:500}th,td{padding:16px 12px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{padding-left:0}td button{padding-left:0;color:var(--bright)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);padding:20px 0 32px;border-bottom:1px solid var(--line);margin-bottom:24px}.metrics strong{display:block;font-size:32px;font-weight:500;margin-top:8px}.empty{padding:52px 0;text-align:center;color:var(--muted)}.empty svg{width:30px;height:30px;margin-bottom:12px}.empty h3{color:var(--text)}.switchline{display:flex;align-items:center;gap:10px;min-height:44px}.switchline input{margin:0}.note{color:var(--muted);font-size:12px}
dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);padding:0;border-radius:12px;width:min(560px,calc(100% - 24px));max-height:90dvh}dialog::backdrop{background:#0008}dialog.left,dialog.right{position:fixed;top:6px;bottom:6px;margin:0;width:420px;max-width:calc(100% - 12px);max-height:none;height:calc(100dvh - 12px)}dialog.left{left:6px}dialog.right{left:auto;right:6px}.dialoghead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.dialogbody{padding:20px;overflow:auto;max-height:calc(100dvh - 100px)}.dialogbody input{margin-bottom:16px}.dialogbody .listrow{padding:12px 0}.dialogbody .listrow button{text-align:left;white-space:normal;justify-content:flex-start;width:100%}.dialogbody details{border-bottom:1px solid var(--line);padding:12px 0}.dialogbody summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px}.resultbutton{display:flex;width:100%;justify-content:space-between;text-align:left}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5;max-width:calc(100% - 32px);padding:12px 20px;border-radius:6px;border:1px solid #55585f;background:var(--bg);box-shadow:0 8px 30px #0005}.hidden{display:none!important}
.mark,.assistanthead .mark{background:#2f68d8;color:#fff;font-family:inherit;font-size:12px}
.primary{background:#2f68d8;color:#fff}
.bad{color:#f17f7f}
button:disabled{opacity:1;color:#a7abb3;background:#303236;border-color:#55585f}
.composer button{min-height:44px;width:44px;height:44px}

"lucide lucide-terminal\" aria-hidden=\"true\"><path d=\"M12 19h8\"></path><path d=\"m4 17 6-6-6-6\"></path></svg>","Download":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-download\" aria-hidden=\"true\"><path d=\"M12 15V3\"></path><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"></path><path d=\"m7 10 5 5 5-5\"></path></svg>","UserRound":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-user-round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"></circle><path d=\"M20 21a8 8 0 0 0-16 0\"></path></svg>","Shield":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-shield\" aria-hidden=\"true\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"></path></svg>"}</script>
<script>
// Official Lucide SVGs are serialized from the installed packages at build time.
const icons=JSON.parse(document.querySelector('#official-lucide').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>icons[name]||'';
function hydrate(){document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=icon(el.dataset.icon))}
const destinations=[['workbench','工作台','MessageSquare'],['agents','智能体','Bot'],['runs','运行记录','History'],['api','API接入','Code2'],['billing','用量费用','ChartNoAxesCombined']];
const names=['通用智能体','接口开发助手','文档整理助手'];
const storage='owa-ia-v2-c';
let state;
try{state=JSON.parse(localStorage.getItem(storage)||'null')}catch{}
state=state||{sessions:[{id:'rest',title:'创建一个简单的 REST API',messages:[],answer:''},{id:'docs',title:'整理接口说明文档',messages:[],answer:''}],active:'rest',drafts:{},keys:[],webhook:''};
let page='workbench',agent=0,agentTab='配置',billTab='分析',apiTab='调用示例',adminTab='账号',accountTab='账号安全',dirty=false;
let runSource='全部来源',runStatus='全部状态',choice='',lastFocus=null,toastTimer;
const runs=[{id:'demo-run-01',title:'创建一个简单的 REST API',source:'工作台',status:'成功',input:'创建一个简单的 REST API，包含健康检查和用户列表接口。',output:'接口结构已整理。健康检查和用户列表使用独立路由，用户列表支持分页。'},
{id:'demo-run-02',title:'整理接口说明',source:'接口调用',status:'成功',input:'将接口定义整理成文档。',output:'样例输出：接口说明包含请求参数、响应结构和错误码。'},
{id:'demo-run-03',title:'接口开发助手评测',source:'评测',status:'失败',input:'验证用户列表接口。',output:'尚未配置测试脚本'}];
const files={'src/app.ts':"import express from 'express';\nimport users from './routes/users';\n\nconst app = express();\napp.get('/health', (_, res) => res.json({ status: 'ok' }));\napp.use('/users', users);\nexport default app;",
'src/routes/users.ts':"import { Router } from 'express';\nconst router = Router();\nrouter.get('/', (req, res) => {\n  const page = Math.max(1, Number(req.query.page) || 1);\n  res.json({ data: [], page, pageSize: 20 });\n});\nexport default router;",
'README.md':'# REST API · 交互样例\n\nGET /health  健康检查\nGET /users?page=1  用户列表\n\n测试脚本：尚未配置。\n代码仅用于界面预览，未经过运行验证。'};
function persist(){try{localStorage.setItem(storage,JSON.stringify(state));return true}catch{toast('浏览器未允许保存，本次修改仅在当前页面保留');return false}}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3000)}
function current(){return state.sessions.find(s=>s.id===state.active)||state.sessions[0]}
function draft(){return state.drafts[agent]||(state.drafts[agent]={name:names[agent],prompt:'你是一个严谨的业务助手。明确任务目标，生成可检查的交付文件；如缺少关键信息，先询问用户。',model:'默认模型',effort:'标准',tools:true,knowledge:'',schema:'',approval:true,share:'仅自己',ai:''})}
function tabs(values,active,action){return `<nav class="tabs" aria-label="页面分区">${values.map(v=>`<button aria-pressed="${v===active}" class="${v===active?'active':''}" data-action="${action}" data-value="${v}">${v}</button>`).join('')}</nav>`}
function head(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function empty(title,sub){return `<div class="empty">${icon('Inbox')}<h3>${title}</h3><p>${sub}</p></div>`}
function render(){
  $('.nav').innerHTML=destinations.map(([id,label,i])=>{const active=page===id||(page==='agent'&&id==='agents');return `<button data-action="nav" data-value="${id}" class="${active?'active':''}" ${active?'aria-current="page"':''}>${icon(i)}${label}</button>`}).join('');
  $('#main').innerHTML=page==='workbench'?workbench():`<div class="page">${({agents:agentsView,agent:agentView,runs:runsView,api:apiView,billing:billingView,admin:adminView,account:accountView}[page]||agentsView)()}</div>`;
  hydrate();
}
function workbench(){
  const s=current(),isRest=s.id==='rest';
  return `<section class="workspace"><div class="sessionbar"><div class="row"><button class="icon" data-action="history" title="会话历史" aria-label="会话历史">${icon('PanelLeft')}</button><div><div class="sessiontitle">${esc(s.title)}</div><div class="sessionmeta">通用智能体</div></div></div><div class="row"><button data-action="details" class="icon" title="工具与文件" aria-label="工具与文件">${icon('PanelRight')}</button><button class="icon" data-action="new" title="新建会话" aria-label="新建会话">${icon('SquarePen')}</button></div></div>
  <div class="thread" id="thread"><div class="readable">
  ${isRest?`<div class="user">创建一个简单的 REST API，包含健康检查和用户列表接口。</div><div class="assistanthead"><span class="mark">OW</span>通用智能体</div>
  <div class="answer"><p>接口结构已整理。健康检查和用户列表使用独立路由，用户列表支持分页。</p>
  <div class="steps"><button class="step" data-action="tool" data-value="Read"><span class="row">${icon('Check')}<span>Read <code>README.md</code></span></span><small class="good">成功 ${icon('ChevronRight')}</small></button>
  <button class="step" data-action="tool" data-value="Write"><span class="row">${icon('Check')}<span>Write <code>src/app.ts</code></span></span><small class="good">成功 ${icon('ChevronRight')}</small></button>
  <button class="step" data-action="tool" data-value="Bash"><span class="row">${icon('CircleAlert')}<span>Bash <code>pnpm test</code></span></span><small class="bad">失败 ${icon('ChevronRight')}</small></button></div>
  <div class="row between"><small>交付文件</small><small>3 个文件</small></div><div class="files">${Object.keys(files).map(f=>`<button data-action="file" data-value="${f}">${icon('FileCode2')}${f}</button>`).join('')}</div>
  <div class="question"><h3>用户数据先放在哪里？</h3>${s.answer?`<p class="muted">已选择：${esc(s.answer)} · 仅记录于此样例</p>`:`<div class="choices">${['内存数据','数据库'].map(c=>`<label class="choice"><input type="radio" name="storage" value="${c}" ${choice===c?'checked':''}>${c}</label>`).join('')}</div><div class="questionfooter"><button class="outline" data-action="answer" ${choice?'':'disabled'}>提交选择 ${icon('ArrowUp')}</button></div>`}</div></div>`:
  s.id==='docs'?`<div class="user">整理接口说明文档。</div><div class="assistanthead"><span class="mark">OW</span>通用智能体</div><p>接口说明可以按请求参数、响应结构与错误码组织。请补充需要整理的接口定义。</p>`:`<h2>新的会话</h2><p class="muted">通用智能体</p>`}
  ${s.messages.map(m=>`<div class="user" style="margin-top:20px">${esc(m)}</div><p class="muted">消息已记录在本地样例，尚未调用智能体。</p>`).join('')}
  </div></div><div class="composerwrap"><form class="composer" id="message-form"><textarea id="message" aria-label="发送消息" placeholder="继续描述你的需求…" required></textarea><div class="row"><small>${icon('Bot')}通用智能体</small><button class="primary icon" type="submit" aria-label="发送" title="发送">${icon('ArrowUp')}</button></div></form></div></section>`;
}
function agentsView(){return head('智能体','配置能力，管理知识与发布。',`<button class="outline" data-action="create-agent">${icon('Plus')}新建草稿</button>`)+
  names.map((n,i)=>`<div class="listrow"><div class="row"><span class="agenticon">${icon(i===2?'Files':'Bot')}</span><div><h3>${esc(state.drafts[i]?.name||n)} ${i?'<span class="badge">样例</span>':''}</h3><small>${['通用任务与文件交付','REST API 设计与接口文档','文档归档、摘要与结构整理'][i]||'未配置能力'} · 仅自己</small></div></div><button data-action="agent" data-value="${i}">配置 ${icon('ChevronRight')}</button></div>`).join('')}
function agentView(){
  const d=draft();
  let body='';
  if(agentTab==='配置')body=`<div class="formgrid"><div class="formstack"><label>智能体名称<input data-field="name" value="${esc(d.name)}"></label><label>系统提示词<textarea data-field="prompt" rows="6">${esc(d.prompt)}</textarea></label><div class="formgrid"><label>模型<select data-field="model">${['默认模型','快速模型','推理模型'].map(n=>`<option ${n===d.model?'selected':''}>${n}</option>`).join('')}</select></label><label>努力级别<select data-field="effort">${['标准','低','高'].map(n=>`<option ${n===d.effort?'selected':''}>${n}</option>`).join('')}</select></label></div></div><aside class="aside"><h3>${icon('Sparkles')} AI 辅助编辑</h3><p>描述需要调整的目标</p><label><span class="note">修改要求</span><textarea data-field="ai" placeholder="例如：补充接口错误处理规则">${esc(d.ai)}</textarea></label><button class="outline" data-action="ai-edit">${icon('Plus')}加入提示词草稿</button><p class="note">样例编辑，不调用模型</p></aside></div>`;
  if(agentTab==='能力')body=`<h2>工具与扩展</h2><div class="listrow"><div><h3>工作空间工具</h3><p class="muted">Read / Write / Bash</p></div><label class="switchline"><input type="checkbox" data-field="tools" ${d.tools?'checked':''}>启用</label></div><div class="listrow"><h3>Skills</h3><span class="muted">未添加</span></div><div class="listrow"><h3>MCP 服务</h3><span class="muted">未连接</span></div><div class="listrow"><h3>子智能体</h3><span class="muted">未配置</span></div>`;
  if(agentTab==='知识')body=`<div class="formstack"><h2>知识文档草稿</h2><label>文档内容<textarea data-field="knowledge" rows="10" placeholder="粘贴需要提供给智能体的参考资料">${esc(d.knowledge)}</textarea></label><p class="note">草稿尚未发布，不会参与检索。</p></div>`;
  if(agentTab==='安全与契约')body=`<div class="formstack"><label class="switchline"><input type="checkbox" data-field="approval" ${d.approval?'checked':''}>执行工具前需要人工审批</label><label>输出契约（JSON Schema）<textarea data-field="schema" placeholder='{"type":"object"}'>${esc(d.schema)}</textarea></label><p class="muted">未填写输出契约时，主要消费对话文本。</p></div>`;
  if(agentTab==='评测')body=`<div class="listrow"><div><h3>用户列表接口</h3><small>交互样例 · 尚未配置测试脚本</small></div><span class="bad">失败</span></div><button class="outline" style="margin-top:20px" data-action="run-detail" data-value="demo-run-03">查看评测详情 ${icon('ChevronRight')}</button>`;
  if(agentTab==='发布与分享')body=`<div class="formstack"><h2>未发布草稿</h2><label>可见范围<select data-field="share">${['仅自己','指定用户','用户组','公开'].map(v=>`<option ${d.share===v?'selected':''}>${v}</option>`).join('')}</select></label><p class="muted">交互样例中的发布预览不会更改真实访问权限。</p><div><button class="outline" data-action="publish">预览发布</button></div></div>`;
  return head(esc(d.name),'智能体 / 详情 / 草稿',`<button class="outline" data-action="nav" data-value="agents">${icon('ArrowLeft')}全部智能体</button>`)+tabs(['配置','能力','知识','安全与契约','评测','发布与分享'],agentTab,'agent-tab')+body+`<div class="savebar"><span class="note" id="draft-state">${dirty?'有未保存修改':'原型草稿 · 未发布'}</span><button class="primary" data-action="save">${icon('Save')}保存草稿</button></div>`;
}
function runsView(){
  const filtered=runs.filter(r=>(runSource==='全部来源'||r.source===runSource)&&(runStatus==='全部状态'||r.status===runStatus));
  return head('运行记录','跨会话查看结果。以下 3 条均为交互样例。')+`<div class="filters"><label>来源<select id="run-source">${['全部来源','工作台','接口调用','评测'].map(x=>`<option ${x===runSource?'selected':''}>${x}</option>`).join('')}</select></label><label>状态<select id="run-status">${['全部状态','成功','失败'].map(x=>`<option ${x===runStatus?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="tablewrap"><table><thead><tr><th>任务</th><th>来源</th><th>状态</th><th>记录</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><button data-action="run-detail" data-value="${r.id}">${r.title}</button></td><td>${r.source}</td><td class="${r.status==='失败'?'bad':'good'}">${r.status}</td><td><span class="badge">交互样例</span></td></tr>`).join('')}</tbody></table></div>${filtered.length?'':empty('没有匹配的运行','调整来源或状态筛选。')}`;
}
function apiView(){
  let content='';
  if(apiTab==='调用示例')content=`<div class="formgrid"><div><label>选择智能体<select id="api-agent">${names.map((n,i)=>`<option value="${i}" ${i===agent?'selected':''}>${esc(n)}</option>`).join('')}</select></label><pre id="snippet">${esc(snippet())}</pre><button class="outline" data-action="copy">${icon('Copy')}复制片段</button></div><aside class="aside"><h3>异步调用</h3><p>提交任务后，根据 taskId 查询结果。</p><p class="note">示例 Key 不可调用。替换为实际服务地址和有效凭证后再集成。</p></aside></div>`;
  if(apiTab==='API Key')content=`<div class="row between"><h2>样例凭证</h2><button class="outline" data-action="key">${icon('Plus')}签发样例 Key</button></div>${state.keys.length?state.keys.map(k=>`<div class="listrow"><div><h3>集成演示</h3><code>${esc(k)}</code><small>不可调用 · demo 值</small></div><button class="icon" data-action="delete-key" data-value="${k}" title="删除样例 Key" aria-label="删除样例 Key">${icon('Trash2')}</button></div>`).join(''):empty('尚无样例 Key','样例凭证不具备任何访问权限。')}`;
  if(apiTab==='Webhook')content=`<form id="webhook-form" class="formstack"><label>接收地址<input type="url" id="webhook-url" placeholder="https://example.com/webhook" value="${esc(state.webhook)}" required></label><div><button class="outline" type="submit">${icon('Save')}保存样例配置</button></div></form><div class="listrow"><h3>投递记录</h3><span class="muted">0 条</span></div>${empty('暂无投递记录','未发送任何 Webhook 请求。')}`;
  return head('API 接入','调用、凭证与结果回调。')+tabs(['调用示例','API Key','Webhook'],apiTab,'api-tab')+content;
}
function snippet(){return `# 交互样例 · demo Key 不可调用\ncurl -X POST 'https://example.com/api/agents/demo-agent-${agent+1}/invoke' \\\n  -H 'Authorization: Bearer demo_not_a_real_key' \\\n  -H 'Content-Type: application/json' \\\n  -d '{"prompt":"整理接口说明"}'\n\n# 获得 taskId 后查询结果\ncurl 'https://example.com/api/agents/<taskId>/result' \\\n  -H 'Authorization: Bearer demo_not_a_real_key'`}
function billingView(){
  let content=billTab==='分析'?`<div class="metrics"><div><small>可用余额</small><strong>¥ 0</strong></div><div><small>冻结金额</small><strong>¥ 0</strong></div><div><small>已结算费用</small><strong>¥ 0</strong></div></div>${empty('暂无用量数据','当前没有计费记录。')}`:billTab==='流水'?empty('暂无收支流水','没有已结算或待结算记录。'):billTab==='价格'?empty('尚未配置价格','以平台实际公布的模型价格为准。'):`<div class="row between"><h2>充值与订单</h2><button class="outline" data-action="order">${icon('Plus')}样例订单</button></div>${empty('暂无真实订单','没有进行任何支付。')}`;
  return head('用量费用','账户用量、结算与订单。')+tabs(['分析','流水','充值与订单','价格'],billTab,'bill-tab')+content;
}
function adminView(){return head('平台管理','样例管理员身份预览')+tabs(['账号','模型与算力','计费','运营审计'],adminTab,'admin-tab')+
  (adminTab==='账号'?`<div class="listrow"><div><h3>样例管理员</h3><small>管理员 · 交互样例</small></div><span class="badge">当前预览身份</span></div>`:adminTab==='模型与算力'?empty('没有已连接的模型服务','此预览未接入算力。'):adminTab==='计费'?empty('尚未设置计费规则','没有已启用的价格方案。'):empty('暂无平台审计记录','本地交互不会写入平台日志。'))}
function accountView(){return head('账号设置','个人身份与安全')+tabs(['账号安全','操作日志'],accountTab,'account-tab')+(accountTab==='账号安全'?`<div class="listrow"><div><h3>样例管理员</h3><p class="muted">未绑定真实账号</p></div><span class="avatar">L</span></div><div class="listrow"><div><h3>密码与登录</h3><small>当前为离线预览，没有登录凭证</small></div></div>`:empty('暂无账号操作日志','此预览未连接账号服务。'))}
function openDialog(title,content,side=''){
  lastFocus=document.activeElement;$('#overlay').className=side;$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=content;hydrate();if(!$('#overlay').open)$('#overlay').showModal();
}
function closeDialog(){$('#overlay').close()}
function historyList(query=''){return state.sessions.filter(s=>s.title.includes(query)).map(s=>`<div class="listrow"><button data-action="session" data-value="${s.id}" class="${s.id===state.active?'selected':''}">${icon('MessageSquare')}<span>${esc(s.title)}<small>交互样例</small></span></button></div>`).join('')||'<p class="muted">没有匹配的会话</p>'}
function showHistory(){openDialog('会话历史',`<input id="history-search" aria-label="搜索会话" placeholder="搜索会话"><button class="outline" data-action="new">${icon('Plus')}新建会话</button><div id="history-list">${historyList()}</div>`,'left')}
function searchResults(q=''){return destinations.filter(([,n])=>n.includes(q)).map(([id,n,i])=>`<button class="resultbutton" data-action="nav" data-value="${id}"><span>${icon(i)} ${n}</span>${icon('ChevronRight')}</button>`).join('')||'<p class="muted">没有匹配的目的地</p>'}
function toolDetail(name){return `<span class="badge">交互样例</span><details open><summary>${icon('Terminal')}${name==='Bash'?'pnpm test':name==='Read'?'Read README.md':'Write src/app.ts'}</summary><pre>${name==='Bash'?'尚未配置测试脚本':name==='Read'?'样例：已读取 README.md':'样例：已写入 src/app.ts'}</pre><p class="${name==='Bash'?'bad':'good'}">${name==='Bash'?'失败':'成功'} · 工具过程样例</p></details>`}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;
  if(a==='close'){closeDialog();return}
  if(a==='nav'){page=v;if($('#overlay').open)closeDialog();render();return}
  if(a==='search'){openDialog('搜索',`<input id="global-search" aria-label="搜索目的地" placeholder="搜索目的地" autofocus><div id="search-results">${searchResults()}</div>`);return}
  if(a==='history'){showHistory();return}
  if(a==='session'){state.active=v;choice='';persist();closeDialog();page='workbench';render();return}
  if(a==='new'){const s={id:'local-'+Date.now(),title:'新会话',messages:[],answer:''};state.sessions.unshift(s);state.active=s.id;persist();if($('#overlay').open)closeDialog();page='workbench';render();$('#message').focus();return}
  if(a==='answer'){if(!choice)return;current().answer=choice;persist();render();toast('选择已记录，未发起真实运行');return}
  if(a==='tool'){openDialog('工具详情',toolDetail(v),'right');return}
  if(a==='file'){openDialog(v,`<span class="badge">文件交互样例</span><pre>${esc(files[v])}</pre><button class="outline" data-action="download" data-value="${v}">${icon('Download')}下载样例</button>`,'right');return}
  if(a==='download'){const url=URL.createObjectURL(new Blob([files[v]],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=v.split('/').pop();link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
  if(a==='details'){openDialog('工具与文件',current().id==='rest'?`<h3>工具过程</h3>${['Read','Write','Bash'].map(t=>toolDetail(t)).join('')}<h3 style="margin-top:24px">交付文件</h3>${Object.keys(files).map(f=>`<button class="resultbutton" data-action="file" data-value="${f}">${icon('FileCode2')}${f}${icon('ChevronRight')}</button>`).join('')}`:empty('暂无工具与文件','当前会话尚未执行任务。'),'right');return}
  if(a==='agent'){agent=Number(v);agentTab='配置';page='agent';render();return}
  if(a==='create-agent'){agent=names.length;names.push('未命名智能体');draft();dirty=true;page='agent';agentTab='配置';render();return}
  if(a==='agent-tab'){agentTab=v;render();return}
  if(a==='save'){try{if(draft().schema)JSON.parse(draft().schema)}catch{toast('输出契约需要有效的 JSON');return}if(persist()){dirty=false;render();toast('原型草稿已保存，尚未发布')}return}
  if(a==='ai-edit'){if(!draft().ai.trim()){toast('请先填写修改要求');return}draft().prompt+='\n'+draft().ai.trim();dirty=true;render();toast('要求已加入草稿；未调用模型');return}
  if(a==='publish'){openDialog('发布预览',`<p>智能体：${esc(draft().name)}</p><p>可见范围：${esc(draft().share)}</p><p class="muted">交互样例，草稿仍未发布。</p><button class="outline" data-action="close" style="margin-top:20px">返回草稿</button>`);return}
  if(a==='run-detail'){const r=runs.find(r=>r.id===v);openDialog('运行详情',`<span class="badge">交互样例</span><h3 style="margin-top:16px">${r.title}</h3><p class="muted">${r.id} · ${r.source}</p><p class="${r.status==='失败'?'bad':'good'}">${r.status}</p><h3 style="margin-top:24px">输入</h3><pre>${r.input}</pre><h3>输出</h3><p>${r.output}</p>`,'right');return}
  if(a==='api-tab'){apiTab=v;render();return}
  if(a==='key'){state.keys.push('demo_not_callable_'+Date.now().toString(36));persist();render();return}
  if(a==='delete-key'){state.keys=state.keys.filter(k=>k!==v);persist();render();toast('样例 Key 已删除');return}
  if(a==='copy'){try{await navigator.clipboard.writeText(snippet());toast('调用片段已复制')}catch{openDialog('复制调用片段',`<textarea rows="12" readonly aria-label="调用片段">${esc(snippet())}</textarea>`)}return}
  if(a==='bill-tab'){billTab=v;render();return}
  if(a==='order'){openDialog('样例订单',`<form id="order-form"><label>金额（元）<input id="order-amount" type="number" min="1" max="100000" step="1" value="100" required></label><p class="muted">仅预览确认，不进行支付。</p><button class="primary" style="margin-top:16px">预览确认</button></form>`);return}
  if(a==='account-menu'){openDialog('样例管理员',`<button class="resultbutton" data-action="nav" data-value="account">${icon('UserRound')}账号设置${icon('ChevronRight')}</button><button class="resultbutton" data-action="nav" data-value="admin">${icon('Shield')}平台管理${icon('ChevronRight')}</button>`);return}
  if(a==='admin-tab'){adminTab=v;render();return}
  if(a==='account-tab'){accountTab=v;render()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.field){draft()[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;dirty=true;if($('#draft-state'))$('#draft-state').textContent='有未保存修改'}
  if(el.id==='global-search')$('#search-results').innerHTML=searchResults(el.value.trim());
  if(el.id==='history-search')$('#history-list').innerHTML=historyList(el.value.trim());
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.name==='storage'){choice=el.value;document.querySelector('[data-action=answer]').disabled=false}
  if(el.id==='run-source'){runSource=el.value;render()}
  if(el.id==='run-status'){runStatus=el.value;render()}
  if(el.id==='api-agent'){agent=Number(el.value);$('#snippet').textContent=snippet()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='message-form'){const text=$('#message').value.trim();if(!text)return;const s=current();s.messages.push(text);if(s.title==='新会话')s.title=text.slice(0,30);persist();render();$('#thread').scrollTop=$('#thread').scrollHeight;$('#message').focus()}
  if(e.target.id==='webhook-form'){state.webhook=$('#webhook-url').value;if(persist())toast('样例配置已保存，未发送请求')}
  if(e.target.id==='order-form'){const amount=Number($('#order-amount').value);$('#dialog-content').innerHTML=`<h3>订单确认</h3><p>样例金额：¥ ${amount}</p><p class="muted">没有生成真实订单，未进行扣款或充值。</p><button class="outline" data-action="close" style="margin-top:20px">完成预览</button>`}
});
$('#overlay').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus()});
if(!('closedBy' in HTMLDialogElement.prototype))$('#overlay').addEventListener('click',e=>{if(e.target!==$('#overlay'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()});
// Names created in this prototype are reconstructed from its isolated saved drafts.
Object.keys(state.drafts).map(Number).sort((a,b)=>a-b).forEach(i=>{if(i>=names.length)names[i]=state.drafts[i].name});
render();
</script>
</body>
</html>
