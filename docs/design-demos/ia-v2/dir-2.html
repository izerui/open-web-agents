<title>Open Web Agents · 对象工作区 · 交互样例</title>

svg{flex:none;vertical-align:middle}input,select,textarea{background:var(--bg);border:1px solid #51545b;border-radius:6px;padding:10px 12px;min-height:44px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--light);box-shadow:0 0 0 1px var(--light)}textarea{resize:vertical;min-height:110px}input[type=checkbox],input[type=radio]{width:18px;min-height:18px;accent-color:var(--blue)}

.shell{height:calc(100dvh - 56px);display:grid;grid-template-columns:264px minmax(0,1fr);gap:6px;padding:6px}.tree,.workspace{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tree{background:var(--panel);display:flex;flex-direction:column;padding:10px 8px}.tree-title{display:flex;align-items:center;padding-left:10px;margin-bottom:14px}.tree-title strong{font-weight:600}.tree-scroll{flex:1;overflow:auto}.tree button{width:100%;justify-content:flex-start;text-align:left}.tree-title button{width:44px;justify-content:center}
.agent-row{margin-top:4px}.agent-row svg{color:var(--light)}.agent-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sessions{margin:0 4px 14px 18px;padding-left:8px;border-left:1px solid #51545b}.sessions button{font-size:13px;line-height:1.5;gap:8px}.sessions svg{width:15px}.tree-bottom{border-top:1px solid var(--line);padding-top:8px}.tree-bottom button{color:var(--muted)}.tree-bottom .account{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.workspace{display:flex;flex-direction:column;background:var(--bg)}.object-header{display:flex;align-items:center;gap:12px;padding:18px 24px 12px;background:var(--panel)}.object-symbol{width:38px;height:38px;display:grid;place-items:center;color:#83aaff;background:var(--select);border-radius:6px}
.tabs{display:flex;gap:6px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}.tabs button{border-radius:0;border-bottom:2px solid transparent;min-width:88px;padding:10px 12px}.tabs button.selected{border-bottom-color:var(--light);color:white}.content{flex:1;min-height:0;overflow:auto}
.chat{height:100%;display:flex;flex-direction:column}.chat-title{padding:16px 28px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.chat-title h2{font-size:15px}.transcript{flex:1;overflow:auto;padding:24px max(28px,calc((100% - 850px)/2));scrollbar-gutter:stable}.message{margin-bottom:24px}.speaker{font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--muted)}.avatar{width:24px;height:24px;border-radius:4px;background:#393b40;display:grid;place-items:center;color:var(--text);font-size:12px}
.message p{margin:0;line-height:1.9}.reply{padding-left:32px}.tools{margin:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}details{border-bottom:1px solid var(--line)}details:last-child{border:0}summary{cursor:pointer;min-height:44px;padding:9px 0;color:var(--muted)}summary span{float:right;font-size:12px}details pre{margin:0 0 12px}.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.file{border:1px solid var(--line);background:var(--panel);font:12px ui-monospace,monospace}

</head>

 if(type==='close'){modal.close();return}
 if(type==='agent'){current=value;sessionId=agent().sessions[0]?.id;globalPage='';source='';status='';navigate();return}
 if(type==='session'){sessionId=value;tab='对话';globalPage='';navigate();return}
 if(type==='tab'){tab=value;globalPage='';source='';status='';navigate();return}
 if(type==='global'){globalPage=value;source='';status='';navigate();return}
 if(type==='home'){globalPage='';tab='对话';navigate();return}
 if(type==='section'){section=value;render();return}
 if(type==='billing'){billing=value;render();return}
 if(type==='admin'){admin=value;render();return}
 if(type==='account'){account=value;render();return}
 if(type==='api'){apiView=value;render();return}
 if(type==='new-session'){const s={id:'s-'+Date.now(),name:'新会话',messages:[]};agent().sessions.push(s);sessionId=s.id;tab='对话';globalPage='';persist();navigate();return}
 if(type==='create-agent'){openModal('新建智能体',`<form id="create-agent"><label class="field"><span>智能体名称</span><input name="name" maxlength="40" required autofocus placeholder="例如：接口评审助手"></label><button class="primary" type="submit">${icon('Plus')}创建本地草稿</button></form>`);return}
 if(type==='answer'){const s=session();if(!s.choice)return;s.answer=s.choice;s.messages.push({role:'assistant',text:`已记录选择：${s.answer}。这条样例不会启动模型运行。`});persist();render();return}
 if(type==='files'){openModal('会话交付文件',`<p class="muted">创建一个简单的 REST API · 交互样例</p>${Object.keys(files).map((f,i)=>btn(esc(f),`file:${i}`,'FileCode','file')).join(' ')}`);return}
 if(type==='file'){const f=Object.keys(files)[Number(value)];if(modal.open)modal.close();openModal(f,`${badge('交互样例')}<pre>${esc(files[f])}</pre>${btn('下载样例文件',`download:${value}`,'Download','outline')}`);return}
 if(type==='download'){const f=Object.keys(files)[Number(value)],url=URL.createObjectURL(new Blob([files[f]],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download=f.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
 if(type==='run'){const r=runData[Number(value)];openModal(`运行 ${r.id}`,`${badge('交互样例')}<p>${esc(data.agents.find(a=>a.id===r.agent)?.name)} / ${r.session}</p><div class="row"><span>来源：${r.source}</span><span class="${r.status==='失败'?'bad':'good'}">${r.status}</span></div><h3>输入</h3><pre>${esc(r.input)}</pre><h3>输出</h3><pre>${esc(r.output)}</pre>${r.id==='R-001'?'<details><summary>工具失败说明</summary><pre>Bash pnpm test：尚未配置测试脚本</pre></details>':''}`);return}
 if(type==='save'){savedMessage=saveConfig();render();return}
 if(type==='evaluate'){cfg().evalResult=cfg().prompt.trim()?'样例检查通过：系统提示词非空。未调用模型。':'样例检查失败：系统提示词为空。';render();return}
 if(type==='publish'){savedMessage=saveConfig();if(!savedMessage.startsWith('已保存')){render();return}agent().published=true;log(`发布 ${agent().name} 的样例版本`);savedMessage='样例版本已发布，仅保存在本机。';render();return}
 if(type==='ai'){openModal('AI 辅助编辑',`<p>${esc(agent().name)} / 系统提示词</p><p class="muted">预置编辑建议 · 交互样例</p><pre>先明确输入与验收条件，再执行任务。交付时列出文件路径、验证结果与尚未完成的事项。</pre>${btn('应用到当前草稿','apply-ai','Check','primary')}`);return}
 if(type==='apply-ai'){cfg().prompt+='\\n先明确输入与验收条件，再执行任务。交付时列出文件路径、验证结果与尚未完成的事项。'.replace('\\n','\n');modal.close();section='配置';savedMessage='建议已应用，待保存。';render();return}
 if(type==='issue-key'){agent().demoKey=true;log(`签发 ${agent().name} 的样例 Key`);render();return}
 if(type==='revoke-key'){agent().demoKey=false;log(`撤销 ${agent().name} 的样例 Key`);render();return}
 if(type==='copy-snippet'){try{await navigator.clipboard.writeText(snippet());$('#copy-status').textContent='已复制样例调用片段'}catch{$('#copy-status').textContent='无法自动复制，请在调用片段中选择文本。'}return}
 if(type==='save-webhook'){try{if(cfg().webhook&&!['https:','http:'].includes(new URL(cfg().webhook).protocol))throw Error();agent().config.webhook=cfg().webhook;$('#webhook-status').textContent=persist()?'接入草稿已保存。':savedMessage}catch{$('#webhook-status').textContent='请输入有效的 HTTP 或 HTTPS 地址。'}return}
 if(type==='webhook'){openModal('Webhook 样例投递',`<p>目标：${esc(cfg().webhook||'未配置')}</p><pre>${esc(JSON.stringify({event:'run.completed',taskId:'demo_task_id',status:'success'},null,2))}</pre><p class="muted">仅预览通知内容，没有发起网络请求。</p>`);return}
 if(type==='order'){openModal('确认样例订单',`<form id="order-form"><label class="field"><span>金额（元）</span><input name="amount" type="number" min="1" max="100000" step="1" value="100" required></label><p class="muted">订单保持未支付状态，余额不会变化。</p><button type="submit" class="primary">确认样例订单</button></form>`);return}
 if(type==='permissions'){openModal('账号权限',`<h3>${esc(data.display)}</h3><p>角色：样例管理员</p><div class="row">账号管理${badge('样例权限')}</div><div class="row">模型与算力管理${badge('样例权限')}</div><div class="row">计费与审计${badge('样例权限')}</div><p class="muted">原型不授予真实平台权限。</p>`);return}
 if(type==='model'){openModal('模型配置预览','<p>当前模型别名：sonnet、opus、haiku</p><p class="muted">尚未绑定服务商或真实模型 ID。</p><pre>凭证：未配置\n连接状态：未连接\n可用算力：无记录</pre>');return}
 if(type==='view-prices'){globalPage='用量与费用';billing='价格';navigate();return}
 if(type==='search'){openModal('搜索目的地','<input id="destination-search" aria-label="搜索目的地" placeholder="搜索智能体、配置、运行…" autofocus><div class="search-results" id="search-results"></div>');search('');return}
 if(type==='destination'){modal.close();if(configSections.includes(value)){globalPage='';tab='配置';section=value}else if(['对话','运行','接入'].includes(value)){globalPage='';tab=value}else globalPage=value;navigate();return}
}
function search(query){const items=['对话','配置','能力','知识','安全与契约','评测','发布与分享','运行','接入','全部运行','用量与费用','平台管理','账号设置'];$('#search-results').innerHTML=items.filter(x=>x.includes(query.trim())).map(x=>btn(`${x}${icon('ChevronRight')}`,`destination:${x}`)).join('')||'<p class="muted">没有匹配的目的地</p>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action);else if(mobileOpen&&!e.target.closest('.tree')){mobileOpen=false;tree()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mobileOpen){mobileOpen=false;tree();$('[data-action="tree"]').focus()}});
document.addEventListener('input',e=>{
 const el=e.target;if(el.dataset.config){cfg()[el.dataset.config]=el.type==='checkbox'?el.checked:el.value;const s=$('#save-status');if(s)s.textContent='有未保存的修改';}
 if(el.id==='destination-search')search(el.value);
});
document.addEventListener('change',e=>{
 if(e.target.name==='storage'){session().choice=e.target.value;persist();$('[data-action="answer"]').disabled=false}
 if(e.target.id==='source-filter'){source=e.target.value;render()}
 if(e.target.id==='status-filter'){status=e.target.value;render()}
 if(e.target.dataset.config==='share')render();
});
document.addEventListener('submit',e=>{
 e.preventDefault();const form=e.target,values=new FormData(form);
 if(form.id==='message-form'){
  const text=String(values.get('message')).trim();if(!text)return;
  if(!session()){const s={id:'s-'+Date.now(),name:text.slice(0,30),messages:[]};agent().sessions.push(s);sessionId=s.id}
  const s=session();if(s.name==='新会话')s.name=text.slice(0,30);
  s.messages.push({role:'user',text},{role:'assistant',text:'已保存你的消息。这是本地交互样例，尚未执行新的模型任务。'});persist();render();$('#transcript').scrollTop=$('#transcript').scrollHeight;
 }
 if(form.id==='create-agent'){const name=String(values.get('name')).trim();if(!name)return;const a=makeAgent('draft-'+Date.now(),name);data.agents.push(a);current=a.id;sessionId=undefined;tab='配置';section='配置';globalPage='';log(`创建智能体草稿：${name}`);modal.close();navigate()}
 if(form.id==='account-form'){const name=String(values.get('display')).trim();if(!name)return;data.display=name;log('修改账号显示名称');render();$('#account-status').textContent='账号草稿已保存。'}
 if(form.id==='order-form'){const amount=Number(values.get('amount'));if(!Number.isInteger(amount)||amount<1||amount>100000)return;data.orders.push(amount);log(`创建 ${amount} 元样例订单，未支付`);modal.close();render()}
});
document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=icon(el.dataset.icon));
render();
</script>
</body>
</html>
